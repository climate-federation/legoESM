# DINO lat-lon, rigid_lid ACC streamfunction solver, full year (365 d / 5 d).
# rigid_lid is the proper ACC solver for the re-entrant channel: the southern
# continent below the channel is a topological island (nisle=2), so the
# depth-integrated ACC transport is solved DIRECTLY as the island circulation
# constant instead of riding the free-surface eta null mode (which the
# implicit_cn / explicit_substep solvers do — they suppress/over-energize +
# ring the ACC around ~44-50 Sv).
#
# Selecting --barotropic-solver rigid_lid auto-applies the Veros-faithful
# coordinated stack (ab2 outer + explicit_ab2 Coriolis + ab2_scope="advective" +
# dt_mom_ratio=9). A BARE rigid_lid flip RUNS AWAY (568 Sv -> NaN): the
# bottom-drag depth-mean reaches the streamfunction barotropic balance only via
# the du_diss fold, which is gated on ab2_scope="advective". With the full stack
# DINO rigid_lid spins up STABLY (7 -> 31 Sv over 180 d, still rising toward the
# physical wind-driven transport; tightest barotropic streamfunction Psi 42-73).
#
# Reproduce: JAX_ENABLE_X64=1 python scripts/run/run_dino.py \
#                --config scripts/experiment/dino/rigid_lid_latlon_365d.yaml
# Then: python scripts/plot/plot_dino_acc.py results/dino_latlon_rigid_lid
grid: latlon
barotropic_solver: rigid_lid
vmix: kpp
days: 365
snapshot_every_days: 5
n_lon: 50                 # 1deg R1 (~9900 cells)
output_dir: results/dino_latlon_rigid_lid
