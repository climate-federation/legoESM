  normalize_by_scale: true
  T_scale: 30.0
  wind_scale: 20.0
  q_scale: 0.005
  ps_scale: 1000.0
neural_gcm:
  spatial_embedding: false
  surface_drag_confounded: builder_refuses_classical_scheme
  nn_hidden: 256
  nn_layers: 4
sfno:
  spatial_embedding: false
  sfno_embed_dim: 256
  sfno_n_blocks: 8
classical:
  trainable_schemes: aggressive
  convection: zhang_mcfarlane
  turbulence: clubb
  cloud: cam6_clubb
  microphysics: morrison
  gwd: mcfarlane
  surface_bulk: constant
  rad_update_interval_steps: 2  # AMIP production: hourly radiation
  orbital_insolation: true
  convective_rain_to_surface: true
  rrtmgp_gpoint_batch_size: 8
  rrtmgp_overhead_layer: true  # AMIP production: CAM RRTMG lid layer above the model top
  rrtmgp_compute_fp32: true    # AMIP production: fp32 optics + RTE solve (dycore stays fp64)
  # AMIP production aerosol (config/amip/amip_production.sh files), as a
  # calendar-month climatology over 2005-2014: the files end 2014 and the WB
  # windows are 2015-2020 (owner 2026-10-16). Radiation optics + Morrison
  # droplet number from aerosol (nc_from_aerosol below), as AMIP runs them.
  aerosol_file: /work/bb1596/b309178/diffESM/legoesm_ap/data/forcing/cmip6_1979-2014/aeropt_macv2sp_sw_b14_tot_1850-2014_MACv1bg.nc
  aerosol_ccn_file: /work/bb1596/b309178/diffESM/legoesm_ap/data/forcing/cmip6_1979-2014/aeropt_macv2sp_sw_b14_fin_1850-2014_MACv1bg.nc
  # Production names the 1850-2014 IACETH-v4 build, not staged here; its
  # 1979-2014 records equal this file (amip_production.sh, #1948).
  volcanic_aerosol_file: /work/bb1596/b309178/diffESM/legoesm_ap/data/forcing/cmip6_1979-2014/bc_aeropt_cmip6_volc_lw_b16_sw_b14_1979-2014.nc
  volcanic_aerosol_lw: true
  aerosol_reference_aod: 0.03
  aerosol_climatology_years: [2005, 2014]
  param_fixed:
    atm.clouds.CloudConfig:
      # 0.0 = floor OFF, as in the MPAS production deck (cloud_q_c_diagnostic:
      # 0.0): the diagnostic condensate floor compensates for the closure
      # liquid the partition now delivers, so leaving it on would make the
      # clouds opaque twice. PINNED, not trained (owner 2026-09-27): 0.0 is
      # outside the trainable spec bounds (1e-6, 1e-3), exactly as production
      # treats it (off, untrained).
      q_c_diagnostic: 0.0
      cloud_optics_inhomogeneity: constant  # AMIP production
      cloud_inhomogeneity_factor: 1.0
      cloud_partial_coverage_optics: none
      cloud_vertical_overlap_optics: mcica  # AMIP production (CAM6 McICA)
      conv_cloud_condensate: 0.0  # AMIP production; below trainable bounds, so pinned
      cloud_n_subcolumns: 8
      cloud_fsd: 1.0
      convective_cloud: false
    atm.turb.CLUBBConfig:
      prognostic: true
    atm.micro.MorrisonConfig:
      warm_rain_incloud: true  # AMIP production (CAM6 MG2 in-cloud warm rain)
      nc_from_aerosol: true  # AMIP production --aerosol-ccn
      # CAM6 clubb_do_liqsupersat = .false.: no condensation step after the
      # physics, and no ice-curve blend of it. Matches the MPAS production
      # deck (config/amip/amip_production.yaml, both rows false).
      hard_saturation_adjustment: false
      # The other half of the partition: Morrison's own condensation branch
      # is clamped off, since CLUBB now delivers the liquid.
      liquid_from_closure: true
      homogeneous_ice_nucleation: true
      sed_cfl_substeps: true
      sed_cfl_substeps_max: 256
      sed_cfl_substeps_strict: false
  clubb_top_press_hpa: 150.0
  # CAM6 clubb_intr: the closure's diagnosed liquid IS the host cloud water
  # (seeded in, written back out), so the microphysics stops manufacturing
  # its own. Matches the MPAS production deck's clubb_liquid_partition: true.
  # (TurbulenceConfig.liquid_partition; it moved off CLUBBConfig on main.)
  clubb_liquid_partition: true
  # CAM6 namelist_defaults_cam.xml:1254 (mg2 + clubb_sgs): turbulence and
  # microphysics run in sequence at dt/3 = 600 s inside each physics step,
  # which is what lets the closure's liquid reach the microphysics within
  # the step. Required by the liquid partition.
  cld_macmic_num_steps: 3
