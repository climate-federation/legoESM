# WeatherBench 3-family forecast campaign — spectral T63 core (Ginsburg-quick tier).
#
# One config drives all three families through the SHARED AIMIP spectral stack
# (``legoesm.training.neural_gcm_spectral`` builders via ``scale_build``):
#   * physics    -> differentiable trainable-physics params (gray-rad/SBM stack)
#   * neural_gcm -> per-column MLP physics (NeuralGCM-style)
#   * sfno       -> SFNO replaces gridded physics (dycore retained)
#
# The eval driver (``run_weatherbench_eval.py``) is spectral-state based, so the
# campaign uses the SEMI-IMPLICIT spectral core (bounded training adjoint, no
# pole-cell dt clamp — #817). Track B (Derecho, competitive) reuses this file
# with a larger ``spectral.n_max`` (see config/wb/campaign/spectral_t106.yaml).
#
# CONTROLLED COMPARISON (CLAUDE.md): all three families train + eval on this ONE
# config — identical grid, ERA5 sampling, eval year, leads, metric. Only the
# per-mode model differs. Do NOT compare a number from here to one computed on a
# different grid/sampling.

# --- grid / dycore (spectral core reads yml["spectral"]) ---
grid: "gaussian"
# n_lat/n_lon are the Gaussian transform grid for n_max=63 (quadratic dealias);
# the spectral build derives them from n_max, these are informational + used by
# any lat-lon fallback path.
n_lat: 96
n_lon: 192
nlev: 32
spectral:
  n_max: 63
  dt: 1800.0              # semi-implicit stable large dt; 86400/1800=48 steps/day
  semi_implicit: true
  time_integrator: "ssp_rk3"
  hyperdiff_coeff: 2.5e15
  hyperdiff_order: 2
  spectral_filter_order: 8
  spectral_filter_strength: 0.01

# --- ERA5 (WB2 canonical zarr; 2020 = the WB2 held-out test year) ---
era5_zarr: "gs://weatherbench2/datasets/era5/1959-2023_01_10-wb13-6h-1440x721_with_derived_variables.zarr"
cache_dir: ".cache/wb_campaign_era5"
train_years: [2015, 2016, 2017, 2018, 2019]
eval_years: [2020]
era5_cadence_hours: 6

# --- training ---
n_epochs: 12
optimizer: "adamw"
lr: 3.0e-4
warmup_steps: 500
weight_decay: 1.0e-5
grad_clip_norm: 1.0
grad_accum: 1

# --- multi-step forecast loss (RMSE + grid-CRPS + bias; spectral-CRPS OFF:
#     backward-pass compile explosion at scale, per the T63 sweep lesson) ---
loss:
  w_T: 1.0
  w_u: 0.5
  w_v: 0.5
  w_q: 0.3
  w_ps: 0.3
  w_bias_T: 100.0
  w_bias_u: 1.0
  w_bias_v: 1.0
  w_bias_ps: 1.0
  w_crps_T: 0.5
  w_crps_u: 0.25
  w_crps_v: 0.25
  w_crps_q: 0.5
  w_crps_ps: 0.15
  w_spec_crps_T: 0.0
  w_spec_crps_u: 0.0
  w_spec_crps_v: 0.0
  w_spec_crps_q: 0.0
  multi_step_hours: [6, 12]
  multi_step_weights: [1.0, 1.0]
  level_weighting: "pressure"
  normalize_by_scale: true
  T_scale: 30.0
  wind_scale: 20.0
  q_scale: 5.0e-3
  ps_scale: 1000.0

# --- per-mode overlays (merged when --mode selects them) ---
neural_gcm:
  nn_hidden: 256
  nn_layers: 4
sfno:
  sfno_embed_dim: 256
  sfno_n_blocks: 8
