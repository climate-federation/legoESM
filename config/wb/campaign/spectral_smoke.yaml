# WB campaign SMOKE config — tiny spectral T21, real code path, ~minutes on 1 GPU.
#
# The trainer's --smoke flag only shrinks the LAT-LON grid (n_lat/n_lon/nlev);
# it leaves spectral.n_max untouched, so a spectral smoke needs a genuinely small
# n_max here instead. This exercises the FULL train+eval+plot wiring (grids,
# ERA5 load, rollout, scorecard, plot) at minimal cost — NOT a science run.
grid: "gaussian"
n_lat: 32
n_lon: 64
nlev: 8
spectral:
  n_max: 21
  dt: 1800.0
  semi_implicit: true
  time_integrator: "ssp_rk3"
  hyperdiff_coeff: 2.5e15
  hyperdiff_order: 2
  spectral_filter_order: 8
  spectral_filter_strength: 0.01

era5_zarr: "gs://weatherbench2/datasets/era5/1959-2023_01_10-wb13-6h-1440x721_with_derived_variables.zarr"
cache_dir: ".cache/wb_campaign_era5_smoke"
train_years: [2020]
eval_years: [2020]
era5_cadence_hours: 6
n_training_days: 2

n_epochs: 1
optimizer: "adamw"
lr: 3.0e-4
warmup_steps: 2
weight_decay: 1.0e-5
grad_clip_norm: 1.0
grad_accum: 1

loss:
  w_T: 1.0
  w_u: 0.5
  w_v: 0.5
  w_q: 0.3
  w_ps: 0.3
  multi_step_hours: [6]
  multi_step_weights: [1.0]
  normalize_by_scale: true
  T_scale: 30.0
  wind_scale: 20.0
  q_scale: 5.0e-3
  ps_scale: 1000.0

neural_gcm:
  # #1464: the learned column has NO momentum head, so without this it runs
  # with no physical surface stress at all, while the classical arm it is
  # scored against carries `classical.turbulence` below. The scheme here MUST
  # equal that one — giving the learned arm a *different* momentum scheme
  # swaps one confound for another. Both arms already share hyperdiffusion and
  # the spectral filter; the asymmetry this removes is the surface stress
  # specifically. Intended to remove the confound, not yet shown to move the
  # 12/16 table: the closing artifact is the re-scored comparison.
  # NOTE only reached on the spectral training core; on the lat-lon core the
  # learned arm is built elsewhere and this key is not read.
  surface_drag: true
  surface_drag_scheme: "louis"
  nn_hidden: 64
  nn_layers: 2
sfno:
  sfno_embed_dim: 32
  sfno_n_blocks: 2

# --- classical: the six-family physics stack (owner rule: a classical model
# carries one parameterization of EVERY family, and radiation is always
# RRTMGP). Named explicitly rather than defaulted, so a campaign comparison
# cannot silently differ in more than the variable under test. Matches the
# AIMIP classical arm in MODEL CLASS and in the five scheme choices below.
# It is NOT identical to config/aimip/ace2/suite_classical_v3.yaml, which also
# sets surface_bulk: most and a trainable spatial surface field — so a
# WB-vs-AIMIP number differs by those two knobs plus the campaign itself
# (forcing, ICs, grid). State that when comparing; do not call it "same run".
classical:
  convection: "tiedtke"
  turbulence: "louis"
  cloud: "xu_randall"
  microphysics: "sundqvist"
  gwd: "mcfarlane"
  surface_bulk: "constant"
  rad_update_interval_steps: 6
  spatial_surface: false
