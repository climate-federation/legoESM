# WeatherBench 3-family forecast campaign — spectral T106 (Derecho competitive tier).
#
# Same shared AIMIP spectral stack + eval protocol as spectral_t63.yaml (read its
# header); ONLY the grid resolution + capacity + epoch budget scale up. Use on
# Derecho via scripts/cluster/derecho/run_wb_campaign.pbs with
# WB_CAMPAIGN_CONFIG=config/wb/campaign/spectral_t106.yaml. Do NOT compare a T106
# scorecard number to a T63 one and call the difference an effect — resolution is
# a confound; each tier is self-consistent (CLAUDE.md controlled-comparison rule).

grid: "gaussian"
n_lat: 160
n_lon: 320
nlev: 32
spectral:
  n_max: 106
  dt: 1200.0              # 86400/1200 = 72 steps/day; leads 24/72/120/240 h stay on-grid
  semi_implicit: true
  time_integrator: "ssp_rk3"
  hyperdiff_coeff: 1.0e15
  hyperdiff_order: 2
  spectral_filter_order: 8
  spectral_filter_strength: 0.01

era5_zarr: "gs://weatherbench2/datasets/era5/1959-2023_01_10-wb13-6h-1440x721_with_derived_variables.zarr"
cache_dir: ".cache/wb_campaign_era5_t106"
train_years: [2015, 2016, 2017, 2018, 2019]
train_windows:  # 60 windows = 12 month-start 1-day windows x 5 train-years (~240 6-hourly pairs);
                # all-season + low-autocorrelation so the NN arms avoid the #1047 60-sample null
                # result; day_offset = leap-aware month-start day-of-year, fits the eager loader (#1160).
  - [2015, 0, 1]
  - [2015, 31, 1]
  - [2015, 59, 1]
  - [2015, 90, 1]
  - [2015, 120, 1]
  - [2015, 151, 1]
  - [2015, 181, 1]
  - [2015, 212, 1]
  - [2015, 243, 1]
  - [2015, 273, 1]
  - [2015, 304, 1]
  - [2015, 334, 1]
  - [2016, 0, 1]
  - [2016, 31, 1]
  - [2016, 60, 1]
  - [2016, 91, 1]
  - [2016, 121, 1]
  - [2016, 152, 1]
  - [2016, 182, 1]
  - [2016, 213, 1]
  - [2016, 244, 1]
  - [2016, 274, 1]
  - [2016, 305, 1]
  - [2016, 335, 1]
  - [2017, 0, 1]
  - [2017, 31, 1]
  - [2017, 59, 1]
  - [2017, 90, 1]
  - [2017, 120, 1]
  - [2017, 151, 1]
  - [2017, 181, 1]
  - [2017, 212, 1]
  - [2017, 243, 1]
  - [2017, 273, 1]
  - [2017, 304, 1]
  - [2017, 334, 1]
  - [2018, 0, 1]
  - [2018, 31, 1]
  - [2018, 59, 1]
  - [2018, 90, 1]
  - [2018, 120, 1]
  - [2018, 151, 1]
  - [2018, 181, 1]
  - [2018, 212, 1]
  - [2018, 243, 1]
  - [2018, 273, 1]
  - [2018, 304, 1]
  - [2018, 334, 1]
  - [2019, 0, 1]
  - [2019, 31, 1]
  - [2019, 59, 1]
  - [2019, 90, 1]
  - [2019, 120, 1]
  - [2019, 151, 1]
  - [2019, 181, 1]
  - [2019, 212, 1]
  - [2019, 243, 1]
  - [2019, 273, 1]
  - [2019, 304, 1]
  - [2019, 334, 1]
eval_years: [2020]
era5_cadence_hours: 6

n_epochs: 24
optimizer: "adamw"
lr: 3.0e-4
warmup_steps: 1000
weight_decay: 1.0e-5
grad_clip_norm: 1.0
grad_accum: 1

loss:
  w_T: 1.0
  w_u: 0.5
  w_v: 0.5
  w_q: 0.3
  w_ps: 0.3
  w_bias_T: 100.0
  w_bias_u: 1.0
  w_bias_v: 1.0
  w_bias_ps: 1.0
  w_crps_T: 0.5
  w_crps_u: 0.25
  w_crps_v: 0.25
  w_crps_q: 0.5
  w_crps_ps: 0.15
  w_spec_crps_T: 0.0
  w_spec_crps_u: 0.0
  w_spec_crps_v: 0.0
  w_spec_crps_q: 0.0
  multi_step_hours: [6, 12]
  multi_step_weights: [1.0, 1.0]
  level_weighting: "pressure"
  normalize_by_scale: true
  T_scale: 30.0
  wind_scale: 20.0
  q_scale: 5.0e-3
  ps_scale: 1000.0

neural_gcm:
  nn_hidden: 384
  nn_layers: 4
sfno:
  sfno_embed_dim: 384
  sfno_n_blocks: 10

# --- classical: the six-family physics stack (owner rule: a classical model
# carries one parameterization of EVERY family, and radiation is always
# RRTMGP). Named explicitly rather than defaulted, so a campaign comparison
# cannot silently differ in more than the variable under test. Matches the
# AIMIP classical arm in MODEL CLASS and in the five scheme choices below.
# It is NOT identical to config/aimip/ace2/suite_classical_v3.yaml, which also
# sets surface_bulk: most and a trainable spatial surface field — so a
# WB-vs-AIMIP number differs by those two knobs plus the campaign itself
# (forcing, ICs, grid). State that when comparing; do not call it "same run".
classical:
  convection: "tiedtke"
  turbulence: "louis"
  cloud: "xu_randall"
  microphysics: "sundqvist"
  gwd: "mcfarlane"
  surface_bulk: "constant"
  rad_update_interval_steps: 6
  spatial_surface: false
