# WB classical, owner-selected schemes: bechtold convection, CLUBB
# turbulence, Xu-Randall cloud, Morrison microphysics, McFarlane GWD,
# RRTMGP radiation (pinned for every campaign run).
#
# The column_nn and sfno arms train from config/wb/campaign/spectral_t63.yaml
# — SAME grid, ERA5 sampling, eval year, leads and metric, so the three
# arms differ only in the model. Do not compare across the two files for
# anything else.
# WeatherBench 3-family forecast campaign — spectral T63 core (Ginsburg-quick tier).
#
# One config drives all three families through the SHARED AIMIP spectral stack
# (``legoesm.training.neural_gcm_spectral`` builders via ``scale_build``):
#   * physics    -> the CLASSICAL model: the six-family scheme-parameter stack
#                   (tiedtke/louis/xu_randall/sundqvist/mcfarlane + RRTMGP),
#                   identical to the AIMIP classical arm since 2026-08-12.
#                   It was a 6-knob, 2-family, gray-radiation model before
#                   that — a different experiment under the same name, whose
#                   numbers are NOT a baseline for this one.
#   * neural_gcm -> per-column MLP physics (NeuralGCM-style)
#   * sfno       -> SFNO replaces gridded physics (dycore retained)
#
# The eval driver (``run_weatherbench_eval.py``) is spectral-state based, so the
# campaign uses the SEMI-IMPLICIT spectral core (bounded training adjoint, no
# pole-cell dt clamp — #817). Track B (Derecho, competitive) reuses this file
# with a larger ``spectral.n_max`` (see config/wb/campaign/spectral_t106.yaml).
#
# CONTROLLED COMPARISON (CLAUDE.md): all three families train + eval on this ONE
# config — identical grid, ERA5 sampling, eval year, leads, metric. Only the
# per-mode model differs. Do NOT compare a number from here to one computed on a
# different grid/sampling.

# --- grid / dycore (spectral core reads yml["spectral"]) ---
grid: "gaussian"
# n_lat/n_lon are the Gaussian transform grid for n_max=63 (quadratic dealias);
# the spectral build derives them from n_max, these are informational + used by
# any lat-lon fallback path.
n_lat: 96
n_lon: 192
nlev: 32
spectral:
  n_max: 63
  dt: 1800.0              # outer step; 86400/1800=48 steps/day.  NOT stable on
                          # its own: only the linear gravity-wave subsystem is
                          # implicit, and the explicit RK3 advection blows up at
                          # T63 for dt=1800 (measured 2026-08-23: exponential
                          # p_s blowup from step ~7, e-fold ~1.5 steps, on L32
                          # AND L8; advective spectral CFL u*n_max*dt/a exceeds
                          # the RK3 bound above ~97 m/s).  si_substeps below is
                          # what makes this dt usable.
  semi_implicit: true
  # Full-RK3 sub-stepping at dt/3 = 600 s (matrices rebuilt for the sub-step,
  # tendencies re-evaluated each sub-step — semi_implicit.py).  Measured: 6 h
  # dycore-only p_s error 9.8 kPa (blowup) without it, 872 Pa with it — the
  # same ~0.9 kPa as SI dt600 / explicit dt600.  Keeps 12 outer BPTT steps per
  # 6 h lead (adjoint memory unchanged; outer step is remat'd).
  si_substeps: 3
  time_integrator: "ssp_rk3"
  hyperdiff_coeff: 2.5e15
  hyperdiff_order: 2
  spectral_filter_order: 8
  spectral_filter_strength: 0.01

# --- ERA5 (WB2 canonical zarr; 2020 = the WB2 held-out test year) ---
era5_zarr: "gs://weatherbench2/datasets/era5/1959-2023_01_10-wb13-6h-1440x721_with_derived_variables.zarr"
cache_dir: ".cache/wb_campaign_era5"

# --- cloud condensate in the initial condition ---------------------------
# The WeatherBench2 store carries NO cloud liquid or ice (only
# total_cloud_cover), so without this every training sample starts with
# exactly zero condensate: nothing can activate a microphysics rate
# coefficient inside a six-hour forecast, and the first radiation call of
# every sample sees a clear sky.  ARCO-ERA5 has both fields on the same
# 0.25 degree grid and a superset of these pressure levels, so they are read
# from it as a second store at the same timestamps.
# Set on EVERY arm's deck on purpose: the campaign's whole design is that the
# three arms share one configuration and differ only in the model, so the
# initial conditions must stay identical across them.
era5_cloud_condensate: true
train_years: [2015, 2016, 2017, 2018, 2019]

# --- ERA5 surface fluxes as the lower boundary condition ----------------
# When true, every sample carries ERA5's surface stress (x, y), sensible and
# latent heat flux and upwelling SW/LW (ARCO-ERA5 mean rates at the sample
# start), HELD FIXED over the 6 h window.  The classical arm uses them as its
# turbulent and radiative surface boundary condition (bulk formula, surface
# emission and reflection replaced; its surface leaves are then frozen), the
# learned arms receive the six planes as extra inputs.  Off = the historical
# interactive surface.
era5_surface_fluxes: false
train_windows:  # 60 windows = 12 month-start 1-day windows x 5 train-years (~240 6-hourly pairs);
                # all-season + low-autocorrelation so the NN arms avoid the #1047 60-sample null
                # result; day_offset = leap-aware month-start day-of-year, fits the eager loader (#1160).
  - [2015, 0, 1]
  - [2015, 31, 1]
  - [2015, 59, 1]
  - [2015, 90, 1]
  - [2015, 120, 1]
  - [2015, 151, 1]
  - [2015, 181, 1]
  - [2015, 212, 1]
  - [2015, 243, 1]
  - [2015, 273, 1]
  - [2015, 304, 1]
  - [2015, 334, 1]
  - [2016, 0, 1]
  - [2016, 31, 1]
  - [2016, 60, 1]
  - [2016, 91, 1]
  - [2016, 121, 1]
  - [2016, 152, 1]
  - [2016, 182, 1]
  - [2016, 213, 1]
  - [2016, 244, 1]
  - [2016, 274, 1]
  - [2016, 305, 1]
  - [2016, 335, 1]
  - [2017, 0, 1]
  - [2017, 31, 1]
  - [2017, 59, 1]
  - [2017, 90, 1]
  - [2017, 120, 1]
  - [2017, 151, 1]
  - [2017, 181, 1]
  - [2017, 212, 1]
  - [2017, 243, 1]
  - [2017, 273, 1]
  - [2017, 304, 1]
  - [2017, 334, 1]
  - [2018, 0, 1]
  - [2018, 31, 1]
  - [2018, 59, 1]
  - [2018, 90, 1]
  - [2018, 120, 1]
  - [2018, 151, 1]
  - [2018, 181, 1]
  - [2018, 212, 1]
  - [2018, 243, 1]
  - [2018, 273, 1]
  - [2018, 304, 1]
  - [2018, 334, 1]
  - [2019, 0, 1]
  - [2019, 31, 1]
  - [2019, 59, 1]
  - [2019, 90, 1]
  - [2019, 120, 1]
  - [2019, 151, 1]
  - [2019, 181, 1]
  - [2019, 212, 1]
  - [2019, 243, 1]
  - [2019, 273, 1]
  - [2019, 304, 1]
  - [2019, 334, 1]
eval_years: [2020]
era5_cadence_hours: 6

# --- training ---
n_epochs: 12
optimizer: "adamw"
# Peak rate sized so a parameter can actually cross its range. Adam moves a
# leaf by about the learning rate per step, so the total travel available is
# lr x steps; a sigmoid-bounded parameter needs roughly 5 in the raw
# pre-constraint space to go from one bound to the other. The previous 3.0e-4
# over 2880 steps gave 0.9 -- about a fifth of one parameter's span, so the run
# was rate-limited by its own schedule rather than by the physics. Measured on
# that run: epoch 2, the first at full rate and the peak of the cosine, bought
# 0.65%, and every later epoch would have been slower still.
lr: 1.5e-3
# 500 steps is more than two full epochs at 240 samples, so the old run spent
# its first two epochs still ramping and never saw the peak until epoch 2.
warmup_steps: 200
weight_decay: 1.0e-5
grad_clip_norm: 1.0
grad_accum: 1

# --- multi-step forecast loss (RMSE + grid-CRPS + bias; spectral-CRPS OFF:
#     backward-pass compile explosion at scale, per the T63 sweep lesson) ---
loss:
  w_T: 1.0
  w_u: 0.5
  w_v: 0.5
  w_q: 0.3
  w_ps: 0.3
  w_bias_T: 100.0
  w_bias_u: 1.0
  w_bias_v: 1.0
  w_bias_ps: 1.0
  w_crps_T: 0.5
  w_crps_u: 0.25
  w_crps_v: 0.25
  w_crps_q: 0.5
  w_crps_ps: 0.15
  w_spec_crps_T: 0.0
  w_spec_crps_u: 0.0
  w_spec_crps_v: 0.0
  w_spec_crps_q: 0.0
  multi_step_hours: [6, 12]
  multi_step_weights: [1.0, 1.0]
  level_weighting: "pressure"
  normalize_by_scale: true
  T_scale: 30.0
  wind_scale: 20.0
  q_scale: 5.0e-3
  ps_scale: 1000.0

# --- per-mode overlays (merged when --mode selects them) ---
neural_gcm:
  # NeuralGCM-style spatial embedding: sin/cos lat, land fraction, orography
  # and a learned 8-channel per-column embedding (Kochkov et al. 2024).
  # OFF by default (owner, 2026-09-17): the campaign's learned arms train
  # without it so their numbers stay comparable to the earlier WB arms.  Set
  # true to select it.
  spatial_embedding: false
  surface_drag_confounded: "builder_refuses_classical_scheme"
  # #1464: NOT enabled here, deliberately. This campaign's classical arm runs
  # `clubb`, and the learned arm's drag builder refuses prognostic schemes
  # (clubb/tke/mynn25/clubb_lite/edmf) because it threads no PhysicsState and
  # would re-seed the carry from the floor every step. Giving the learned arm
  # `smagorinsky` or `louis` instead would equalise nothing — it would just
  # change which scheme the two arms differ by. Enable once the builder can
  # thread the CLUBB carry.
  nn_hidden: 256
  nn_layers: 4
sfno:
  # ACE2-style static land-fraction input plane (Watt-Meyer et al. 2024;
  # orography is already a state channel).  OFF by default (owner,
  # 2026-09-17); set true to select it.
  spatial_embedding: false
  sfno_embed_dim: 256
  sfno_n_blocks: 8

# --- classical: the six-family physics stack (owner rule: a classical model
# carries one parameterization of EVERY family, and radiation is always
# RRTMGP). Named explicitly rather than defaulted, so a campaign comparison
# cannot silently differ in more than the variable under test. Matches the
# AIMIP classical arm in MODEL CLASS and in the five scheme choices below.
# It is NOT identical to config/aimip/ace2/suite_classical_v3.yaml, which also
# sets surface_bulk: most and a trainable spatial surface field — so a
# WB-vs-AIMIP number differs by those two knobs plus the campaign itself
# (forcing, ICs, grid). State that when comparing; do not call it "same run".
classical:
  # Owner's scheme set, 2026-08-12. Any family may take any scheme and the
  # trainable parameters follow the choice, so this line IS the experiment —
  # not a restriction of the framework.
  convection: "bechtold"
  turbulence: "clubb"
  cloud: "xu_randall"
  microphysics: "morrison"
  gwd: "mcfarlane"
  surface_bulk: "constant"
  rad_update_interval_steps: 6
  spatial_surface: false
  # Radiation g-point block size (compile/memory tradeoff).  Measured with
  # jax memory_analysis on the real value-and-grad step, T63/L32, 12 steps:
  # 16 -> 50.5 GiB of scratch, 8 -> 44.7 GiB, 4 -> 44.9 GiB (no further gain,
  # radiation stops being the binding term below 8).  The default 16 sat at
  # the limit of an 80 GB card and a run died on it; 8 buys ~5.8 GiB of
  # margin for the cost of walking twice as many blocks.
  rrtmgp_gpoint_batch_size: 8
