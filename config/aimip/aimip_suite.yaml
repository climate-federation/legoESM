# AIMIP intercomparison suite manifest.
#
# Listed variants are trained sequentially, share the ERA5 cache, and
# write a unified ``aimip_scorecard.json`` under ``output_dir``.
#
# The ladder: classical (full physics suite + RRTMGP radiation) →
# column_nn (ALL physics incl. radiation learned by a column MLP) →
# sfno_full (SFNO emulates the ENTIRE atmosphere: dycore + physics).
# The intermediate ``sfno_physics`` rung (SFNO physics, dycore
# retained) stays selectable via ``--variants sfno_physics``.

base: "config/aimip/aimip_era5.yaml"

variants:
  - classical
  - column_nn
  - sfno_full

output_dir: "results/aimip_001"
