# AIMIP variant: classical physics.
#
# Tunes the scheme parameters of Tiedtke (convection), Louis
# (turbulence), surface bulk fluxes, McFarlane (gravity wave drag),
# and Xu-Randall (cloud fraction diagnostic) via end-to-end
# differentiation through the dycore + physics rollout.
#
# See ``training/aimip_params.AIMIPClassicalParams`` for the
# full list of trainable scheme knobs (~26 sigmoid-constrained
# scalars).  Radiation is intentionally off in the smoke harness
# so the loss reflects dynamic + tendency error against ERA5.

aimip_variant: "classical"

# Scheme selection — run_aimip reads these via the ``aimip_*`` keys
# (cfg.get("aimip_convection"), ...). Bare keys (convection:, turbulence:, ...)
# are NOT consumed by run_aimip and were silently ignored.
aimip_convection: "tiedtke"
aimip_turbulence: "louis"
aimip_gwd: "mcfarlane"
aimip_cloud: "xu_randall"
aimip_microphysics: "sundqvist"  # all 5 categories ON (no "none"): micro=off
                                 # wrecks radiation (OLR rmse 34->80). Matches
                                 # the stage1/ace2 sweep baseline.
radiation: "gray"          # Base scheme tag (informational).  The actual
                           # radiation backend used by AIMIPClassicalParams
                           # is controlled by ``aimip_radiation`` in the
                           # base config (gray | rrtmgp).
physics_parameterization: "none"
