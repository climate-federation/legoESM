# DENSE classical (all training years) retrain: every year 1979-2012 x 4
# seasons (544 pairs, chunked streaming) + NeuralGCM-style rollout curriculum
# (12h x2, 24h x2, 72h x1) inside the MAIN loop — stability trained in, not
# bolted on. Mass projection + q_v positivity constraints active in the
# forced rollout (fix 4). Eval held-out 2013-2014.
base: config/aimip/aimip_era5.yaml
cfg_overrides:
  aimip_surface_forcing: true
  # G-point vmap blocks: fast compile (one block body) + bounded backward
  # memory. gpoint_checkpoint=false alone compiled in 2min but OOMd (113 GiB,
  # held all ~256 g-points); batch_size=16 holds only 16/block.
  aimip_rrtmgp_gpoint_batch_size: 16
