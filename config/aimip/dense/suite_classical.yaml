  n_train_days: 136
  n_eval_days: 4
  train_year: 1979
  eval_year: 2013
  # Classical uses the curriculum. The multi-hour rrtmgp compile was the
  # per-g-point prevent_cse=True body (~Ng-fold code) — fixed above by the
  # gpoint vmap-block path (aimip_rrtmgp_gpoint_batch_size:16): one compiled
  # block body (fast) holding only 16 g-points' activations (bounded memory).
  # 72h dropped — its 432-step graph is still the heaviest; 12h+24h suffice.
  aimip_rollout_curriculum:
  - - 12
    - 3
  - - 24
    - 2
  aimip_chunk_windows: 34
  aimip_n_epochs: 5
  loss:
    residual_normalize: true
    normalize_by_scale: false
    w_T: 0.5
    w_u: 0.5
    w_v: 0.5
    w_q: 0.5
    w_ps: 0.3
    level_weighting: pressure
variants:
- classical
output_dir: results/aimip_dense_classical
