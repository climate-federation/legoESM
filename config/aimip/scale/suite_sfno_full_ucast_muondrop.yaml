# NEW BASELINE (labelled as such): Muon + MC-Dropout together.
#
# TWO knobs change vs suite_sfno_full_maxdata. That is normally forbidden —
# but both were measured INDEPENDENTLY first, at epoch_0057 on the fixed
# protocol, and this arm exists to be a new BASELINE rather than an
# attribution experiment:
#
#   muon_partitioned  -> beat baseline on 60/64 field-lead cells, -21% z500
#                        at 24 h, better at EVERY lead
#   sfno_dropout 0.1  -> -15% z500 at 24 h but +12% at 240 h (below the
#                        persistence floor); its VALUE here is not skill, it
#                        is being the MC-Dropout ensemble source that the
#                        stage-2 CRPS fine-tune requires
#
# DO NOT compare this row term-by-term against the single-knob arms and
# attribute a difference to either knob. It is the stage-1 base for stage 2,
# and a new reference point in its own right.
#
# WHY BOTH ARE NEEDED: stage 2 refuses sfno_dropout == 0 (with p=0 every
# MC-Dropout member is identical and the CRPS degenerates to the MAE), and
# the muon arm — the best stage-1 model — has p=0. There is no checkpoint in
# the campaign that is both good and stochastic. This makes one.
#
# PRODUCES: the same WB2 scorecard fields at 24/72/120/240 h.
#   CONFIRMS: z500 24 h at or below the muon arm's 17.16 m, i.e. dropout's
#             regularisation does not cost what Muon gained.
#   REFUTES:  materially worse than 17.16 m -> the two do not compose, and
#             stage 2 must accept the plain dropout arm as its base instead.
#   Expect dropout's day-10 penalty to persist; that is what stage 2 is meant
#   to address, and it is measured, not assumed.
