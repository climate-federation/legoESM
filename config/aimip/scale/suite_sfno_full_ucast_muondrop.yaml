  loss_preset: ace2
  loss: {}
  aimip_optimizer: muon_partitioned
  aimip_lr: 0.0001
  aimip_weight_decay: 0.01
  aimip_ema_decay: 0.999
  aimip_n_epochs: 60
  aimip_patience: 10
  aimip_warmup: 500
