# AIMIP-at-scale variant: SFNO full-atmosphere emulator (no dycore,
# no physics).
#
# The trained SFNO directly maps ``state_t -> state_{t+dt_sfno}``
# (:class:`SFNOPrimitiveEquationModel` in ``state_update`` mode), so the
# ENTIRE atmosphere — dynamics AND all physics including radiation — is
# learned.  A post-hoc dry-air-mass correction is applied after each
# macro step.

aimip_variant: "sfno_full"

# Nothing classical runs — dycore and every physics scheme (radiation
# included) are emulated by the SFNO.  The "none" tags are informational
# (not consumed by run_aimip) and record that no classical scheme is
# active.
convection: "none"
turbulence: "none"
gravity_wave_drag: "none"
cloud_scheme: "none"
microphysics: "none"
radiation: "none"

# SFNO architecture — pinned to the SAME values as the scale
# variant_sfno_physics overlay (64 / 4, which overrides the base's 96 / 6)
# so the sfno_full vs sfno_physics comparison is architecture-matched.
# Raise both together if you want more emulator capacity.
# 32/2 matches the PROVEN t106_headtohead sfno_full config. 64/4 (to
# capacity-match sfno_physics) needs ~63 GiB for one T106 forward+
# backward and OOMs Derecho's 40 GB A100s (job 6765xxx). The full
# emulator's per-step activation is far heavier than sfno_physics's
# tendency head, so the families are NOT capacity-matched anyway —
# each is sized to fit + train. Raise together only on >=80 GB cards.
sfno_embed_dim: 32
sfno_n_blocks: 2
sfno_mlp_expansion: 4
sfno_seed: 0

# Macro time step of the emulator [s]: 6 h, the standard
# SFNO/FourCastNet autoregressive cadence.
dt_sfno: 21600.0

# Rollout curriculum ON (Design-A fair set) — INHERIT the base T106 curriculum
# (12->24->72->120 h, 7 epochs) so sfno_full trains IDENTICALLY to
# column_nn/classical (same epochs + leads). That identical protocol is the
# fairness requirement for the AIMIP + WB2 dual-eval scorecards
# (docs/wb/unified_aimip_wb2_evaluation_scope.md). _train_sfno_full_loop DOES
# support the curriculum now (build_sfno_curriculum_epoch_plan); the P1 probe
# (2026-07-18) confirmed 32/2 + the 120 h phase fits the 40 GB A100. sfno_full
# loads host-resident, so chunk_windows is moot for it — no override needed
# (inherits base; the sfno_full loop ignores chunking).

# Per-model LR (NOT a fairness variable — you cannot share one LR across an MLP
# and an SFNO). The full emulator NaN'd at epoch 0 under the shared 3e-4; 5e-5
# plus the always-on per-channel norm-stats keeps the 12 h-from-random start
# finite (confirm with finitecheck_sfno_full.yaml before the full run).
aimip_lr: 5.0e-5

# sfno_full's trainer rejects data_parallel outright (loud guard, #985 codex
# r4) — override the branch base's global aimip_data_parallel: true. Single-GPU
# by design; submit WITHOUT the DP select line. (Re-added after a --theirs merge
# dropped it, f4d3b535d.)
aimip_data_parallel: false
