# AIMIP variant: column neural-network physics.
#
# Replaces the classical physics step with a per-column MLP
# (``atmosphere/physics/neural_physics.NeuralPhysics``) trained on
# ERA5.  Dycore is the same Gaussian-grid spectral PE used by all
# variants for fair intercomparison.
#
# See ``training_driver.train_neural_gcm`` for the existing training
# entry point; ``scripts/run/run_aimip.py`` dispatches to it when
# ``aimip_variant == "column_nn"``.

aimip_variant: "column_nn"

# ALL physics — convection, turbulence, microphysics, clouds, gravity
# wave drag AND radiation — is LEARNED by the column MLP; no classical
# scheme runs alongside it (the NN produces the total physics tendency).
# The "none" tags below are informational (not consumed by run_aimip)
# and record that no classical scheme is active.
convection: "none"
turbulence: "none"
gravity_wave_drag: "none"
cloud_scheme: "none"
microphysics: "none"
radiation: "none"

# Column MLP hyperparameters.
nn_hidden_dim: 256
nn_n_layers: 4
nn_seed: 0
