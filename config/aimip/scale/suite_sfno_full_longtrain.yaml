# LONGER TRAINING probe — 300 epochs instead of 120.
#
# WHY: a checkpoint-selection sweep on the VALIDATION year 2016 (2017 left
# untouched) showed z500 24 h still IMPROVING at the last epoch trained:
#   epoch  30   60   80  100  120
#   z500  44.94 41.03 40.91 39.47 38.95   (m, val-2016)
# Monotone at every lead. So the 120-epoch budget — inherited from ACE2's
# Table 7, which was sized for ~24,000 days of data, not our 288 — stops the
# run while it is still learning. There is no overfitting to select against;
# the model is UNDER-trained, which is consistent with resolution saturating
# above T42 and with data being the dominant lever all campaign.
#
# Identical to suite_sfno_full_mx4_seed0.yaml except the epoch budget, so the
# comparison is controlled. Resumes from that run's checkpoints (same
# output_dir) rather than retraining the first 120 epochs.
base: config/aimip/aimip_era5.yaml
cfg_overrides:
  loss_preset: ace2
  loss: {}
  aimip_optimizer: adamw
  aimip_lr: 0.0001
  aimip_weight_decay: 0.01
  aimip_ema_decay: 0.999
  aimip_n_epochs: 300
  aimip_patience: 40
  aimip_warmup: 200
  train_windows:
  - [1979, 0, 2]
  - [1979, 91, 2]
  - [1979, 182, 2]
