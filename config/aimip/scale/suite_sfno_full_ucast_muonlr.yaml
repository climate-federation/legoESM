# U-CAST ARM 4: the Muon/AdamW learning-rate RATIO, and nothing else.
#
# Controlled against config/aimip/scale/suite_sfno_full_ucast_muon.yaml
# (NOT against maxdata), changing exactly one field:
#
#     muon_lr_scale: 1.0 -> 10.0
#
# U-Cast (arXiv:2604.09041) runs "peak learning rates of 3e-3 (Muon) and
# 3e-4 (AdamW)" — a 10:1 ratio between the branches. Our muon arm ran BOTH
# branches at the shared 1e-4, because `_muon_partitioned_optimizer` had one
# schedule for both, and still beat AdamW by 21% on z500 at 24 h. This arm
# tests whether the ratio is where the rest of the gain lives.
#
# WHY THE RATIO AND NOT THE ABSOLUTE LR: reaching their 3e-3 from our 1e-4
# base would be a 30x jump AND would move the AdamW branch too. Scaling only
# the Muon branch by 10 reproduces the STRUCTURAL feature (Muon takes an
# order of magnitude more learning rate than the 1-D group) as a single
# variable, at a third of their absolute LR. If it wins, the absolute value
# is the next sweep; if it NaNs, we learn that cheaply.
#
# RISK, stated up front: this repo has already seen MUON-on-all-leaves give
# a silent epoch-1 NaN, which is why muon_partitioned exists. A higher Muon
# LR is exactly the direction that failure lies in. The trainer raises on a
# NaN/Inf loss or gradient at the step that produces it, so the failure mode
# is a fast crash with a logged epoch, not a silently wrong model.
#
# NOTE muon_weight_decay_scale stays at its 0.0 default (= the pre-split
# behaviour: optax's muon applies no decay unless asked). U-Cast does decay
# the Muon branch at 0.1; that is a SEPARATE knob and a separate arm.
#
#   CONFIRMS: z500 24 h below the muon arm's 17.16 m.
#   REFUTES:  worse, or NaN -> the shared-LR muon arm stands as the recipe's
#             usable form at our scale.
base: config/aimip/aimip_era5.yaml
cfg_overrides:
  loss_preset: ace2
  loss: {}
  aimip_optimizer: muon_partitioned
  aimip_lr: 0.0001
  aimip_weight_decay: 0.01
  aimip_ema_decay: 0.999
  aimip_n_epochs: 60
  aimip_patience: 10
  aimip_warmup: 500
