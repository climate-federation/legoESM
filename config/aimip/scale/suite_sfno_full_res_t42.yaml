# Resolution dependence of sfno_full: T42 (4.3 deg).
#
# One of a 4-suite sweep (T21/T42/T63/T106) that changes NOTHING but ``n_max``.
# Same 288 train days, same 120 epochs, same ACE2 optimizer block, same EMA,
# same post-step spectral filter, same variant overlay, same eval protocol
# (2017, 8 inits, WB2 1.5 deg target grid) -- so the scorecard delta is
# attributable to spectral truncation.
#
# ONE CONFOUND, STATED: SFNO SpectralConv weights scale as embed_dim^2 * n_sh,
# and n_sh grows ~n_max^2/2, so PARAMETER COUNT IS NOT HELD FIXED across this
# sweep (T63 = 68.3M at 64-wide/4-block). Higher truncation therefore buys both
# finer scales AND more capacity; the sweep measures their COMBINED effect,
# which is the practical question ("does running finer help?"), not a clean
# resolution-only experiment. Each run logs its own parameter count -- read it
# off the log before interpreting a delta.
#
# ``dt`` is deliberately untouched: it is the DYCORE micro-step and sfno_full
# runs no dycore (its macro step is dt_sfno = 21600 s at every resolution).
base: config/aimip/aimip_era5.yaml
cfg_overrides:
  loss_preset: ace2
  loss: {}
  aimip_optimizer: adamw
  aimip_lr: 0.0001
  aimip_weight_decay: 0.01
  aimip_ema_decay: 0.999
  aimip_n_epochs: 120
  aimip_patience: 20
  aimip_warmup: 200
