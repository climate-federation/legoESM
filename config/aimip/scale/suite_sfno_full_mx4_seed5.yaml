# Multi-seed ensemble member 1/4 — ArchesWeather-Mx4 construct.
#
# "we train a small ensemble of our M models, called ArchesWeather-Mx4, by
# independently training multiple models with different random seeds and
# averaging their outputs at inference time. This helps remove modeling errors
# due to initialization and better approximates the true ensemble mean"
# (arXiv:2412.12971 sec. 3.2).
#
# Identical to config/aimip/scale/suite_sfno_full_t63_allyears_ace2.yaml in
# EVERY respect except ``sfno_seed`` — same 288 train days, same architecture,
# same ACE2 optimizer block, same post-step spectral filter, same eval
# protocol. Seed is the only variable, which is what makes averaging the
# members a variance-reduction rather than a confound.
#
# Score the ensemble with:
#   scripts/validate/run_aimip_wb2_eval.py --variant sfno_full \
#     --suite <this file> --checkpoint <seed0>/params_ema.eqx \
#     --member <seed1>/params_ema.eqx --member <seed2>/params_ema.eqx ...
# which averages the member FORECASTS at each lead (not the weights — averaging
# weights across independently-initialised nets is meaningless).
base: config/aimip/aimip_era5.yaml
cfg_overrides:
  loss_preset: ace2
  loss: {}
  aimip_optimizer: adamw
  aimip_lr: 0.0001
  aimip_weight_decay: 0.01
  aimip_ema_decay: 0.999
  aimip_n_epochs: 120
  aimip_patience: 20
  aimip_warmup: 200
  train_windows:
  - [1979, 0, 2]
  - [1979, 91, 2]
