# AIMIP AT SCALE v2 — T106 all-years DENSE (1152 pairs) + rollout curriculum
# (12x2/24x2/72x2/120x1) + chunked streaming + budget constraints. The four
# ACE2-gap fixes applied at the Derecho/Levante tier. ~GPU-week on A100-80.
aimip_grid: gaussian
n_max: 106
n_levels: 8
dt: 400.0
aimip_n_epochs: 15
aimip_patience: 4
aimip_min_delta: 0.001
aimip_lr: 0.0003
aimip_warmup: 50
aimip_weight_decay: 1.0e-05
aimip_grad_clip: 1.0
aimip_optimizer: adamw
aimip_radiation: rrtmgp
# G-point vmap block size (pre-adopted from PR #1098 pending its merge): 8
# bounds RRTMGP's backward pass to 8 g-points/block at T106's ~4x-T63 column
# count (the global default 16 risks A100-80 OOM; the per-g-point
# prevent_cse path was the ~9 h classical compile). Drop to 4 on <80 GB.
aimip_rrtmgp_gpoint_batch_size: 8
aimip_rad_update_interval: 6
# RRTMGP g-point vmap-block accumulation: one compiled block body (fast
# reverse-AD compile — the per-g-point prevent_cse path was the ~9 h classical
# compile) holding only 8 g-points' activations. Pinned (not left to the
# global default 16) because T106 has ~4x T63's columns, so the backward block
# scales ~4x in memory; 8 keeps the classical adjoint inside an A100-80. Drop
# to 4 if RESOURCE_EXHAUSTED on a <80 GB card.
aimip_rrtmgp_gpoint_batch_size: 8
aimip_convection: edmf
aimip_turbulence: louis
aimip_gwd: mcfarlane
aimip_microphysics: sundqvist
aimip_cloud: xu_randall
aimip_spatial_surface: true
aimip_spatial_init_std: 0.0
aimip_spatial_seed: 0
aimip_spatial_lr_scale: 1.0
aimip_surface_forcing: true
