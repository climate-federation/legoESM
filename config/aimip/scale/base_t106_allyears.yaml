# AIMIP AT SCALE — T106 (~1.1 deg, 160x320) base for Derecho/Levante 80GB A100.
# ALL training years 1979-2014 x 4 seasons = 576 IC/target pairs (full ENSO +
# seasonal cycle), eval held-out 2015-2017. RRTMGP radiation, spatial surface
# coefs, prescribed-SST forcing on. SFNO embed 96/6blk, column MLP 512/6.
