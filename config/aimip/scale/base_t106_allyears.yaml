aimip_chunk_windows: 18
# --- #985 throughput (both inert without their runtime precondition) ---
# Prefetch back ON (2026-07-16): 7fcd02ec5 host-builds the buffered chunk on
# the CPU backend (launcher exports JAX_PLATFORMS=cuda,cpu) and stages one
# sample at a time to the GPU, fixing the 2026-07-15 OOM (the prefetched
# chunk no longer rides GPU memory during the training peak).
aimip_chunk_prefetch: true
# Data-parallel: shards each chunk's samples across MPI ranks (gradients
# averaged via mpi4jax). ACTIVE ONLY under an mpiexec launch with nproc>1
# (train_aimip_derecho.pbs auto-detects from the select line); single-process
# runs take the serial path unchanged. NOTE: DP changes the effective batch
# (1 -> nproc samples/update) — a DP run is a new training arm, not a
# continuation of a serial trajectory.
aimip_data_parallel: true
