# sfno_full, 288 d, with the GraphCast / ArchesWeather TRAINING RECIPE.
#
# Controlled against config/aimip/scale/suite_sfno_full_t63_allyears_ace2.yaml
# (same grid, same variant overlay, same 288 train days, same eval protocol).
# The variables under test are the three recipe elements those papers share and
# our ACE2-style arm lacks:
#
#  1. AUTOREGRESSIVE ROLLOUT FINE-TUNING (the big one). ACE2 supervises two
#     6-h steps and relies on in-graph hard constraints for long-horizon
#     stability; GraphCast instead trains a 12-step curriculum, and
#     ArchesWeather fine-tunes on 2-day (8k steps), 3-day (8k) and 4-day (4k)
#     rollouts "with gradients from the full trajectory"
#     (arXiv:2412.12971 sec. 3.2, phase 3). Our WB2 scores degrade fastest at
#     long lead, which is exactly what that phase targets.
#     NOTE the overlay comment claiming _train_sfno_full_loop cannot do this is
#     STALE: build_sfno_curriculum_epoch_plan (neural_gcm_spectral.py:3541) is
#     called at :3715, and run_aimip._build_spectral_config forces
#     loss.multi_step_hours to the curriculum leads so a target is loaded per
#     phase. Verified end-to-end 2026-07-28 before enabling it here.
#  2. DENSITY LEVEL WEIGHTING. GraphCast and ArchesWeather weight upper-air
#     variables by a coefficient proportional to air density, "to give more
#     importance to variables closer to the surface" (arXiv:2412.12971 A.1).
#     Our default `pressure` weighting is a Gaussian centred at 500 hPa, which
#     downweights the surface as well as the top — a different objective, and
#     our worst headline fields (t2m, mslp, ws10) are the surface ones.
#  3. ARCHESWEATHER OPTIMIZER: AdamW lr 3e-4, weight decay 0.05, linear warmup
#     then cosine (arXiv:2412.12971 A.1). We keep EMA 0.999 from ACE2, which
#     ArchesWeather does not use, because it is already validated in our runs.
#
# NOT replicated (stated, not silently dropped):
#  * ArchesWeather conditions on TWO previous states; our SFNO is single-state.
#    That is an architecture change (input channel count), not a config knob.
#  * Recent-past fine-tuning (phase 2: refit on 2007-2018 because early ERA5 is
#    less observation-constrained). Cheap to add later as a second suite.
#  * Multi-seed ensembling (ArchesWeather-Mx4 averages 4 seeds).
#  * GraphCast's 12-step curriculum depth: we stop at 4 d (16 macro steps),
#    sized to the chain-link budget.
base: config/aimip/aimip_era5.yaml
cfg_overrides:
  loss_preset: ace2
  loss: {level_weighting: density}
  aimip_optimizer: adamw
  aimip_lr: 0.0003
  aimip_weight_decay: 0.05
  aimip_ema_decay: 0.999
  aimip_n_epochs: 105
  aimip_patience: 20
  aimip_warmup: 500
  train_windows:
