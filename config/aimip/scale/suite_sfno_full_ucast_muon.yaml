# U-CAST ARM 2: Muon optimizer, and NOTHING else.
#
# Controlled against config/aimip/scale/suite_sfno_full_maxdata.yaml, changing
# exactly one field:
#
#     aimip_optimizer: adamw -> muon_partitioned
#
# U-Cast (arXiv:2604.09041) trains with Muon (peak LR 3e-3) plus AdamW for the
# 1-D parameters, and ablates the swap directly: plain AdamW "degrades z500
# CRPS by up to 15%" in the 1-3 day range. It is their single largest
# optimizer effect and, for us, a one-line change to an optimizer
# ``ml.training.create_optimizer`` already ships.
#
# ``muon_partitioned``, not bare ``muon``: MUON's orthogonalized update is
# defined for 2-D weight matrices, so the partitioned variant applies it only
# to those and routes 1-D biases / norm scales to AdamW — which is exactly
# U-Cast's split, and what create_optimizer's own docstring says legoESM
# should use when muon is requested.
#
# NOTE this arm CORRECTS a self-inflicted regression as much as it tests a
# paper result: ``run_aimip`` itself defaults to ``muon``; the ACE2-copying
# suites explicitly overrode it back to AdamW to reproduce ACE2's recipe, and
# every sfno_full arm measured in this campaign has therefore been AdamW. The
# swap has never been measured here.
#
# LR: left at the baseline's 1e-4. Muon's published peak LR is 3e-3, but
# changing the optimizer AND the learning rate makes the run unattributable.
# If this arm underperforms, an LR sweep on the winner is the follow-up, not a
# confound folded into arm 2.
#
# PRODUCES: the same WB2 scorecard fields at 24/72/120/240 h on the fixed
# protocol (eval year 2017, 60 inits, 144 h stride, WB2 1.5 deg).
#   CONFIRMS: z500/t850 RMSE improves measurably over the maxdata baseline.
#   REFUTES:  RMSE flat or worse -> the Muon result does not transfer to a
#             68M-param SFNO at our data volume, and the AdamW default stands.
# No cheaper offline test exists: an optimizer is only observable through
# training.
base: config/aimip/aimip_era5.yaml
cfg_overrides:
  loss_preset: ace2
  loss: {}
  aimip_optimizer: muon_partitioned
  aimip_lr: 0.0001
  aimip_weight_decay: 0.01
  aimip_ema_decay: 0.999
  aimip_n_epochs: 60
  aimip_patience: 10
  aimip_warmup: 500
  train_windows:
