# sfno_full at T63 with ACE2's LEARNING STRATEGY scaled up (the ACE2-chasing arm).
#
# Controlled against config/aimip/scale/suite_sfno_full_t63_ace2.yaml: same
# grid (T63 L8), same variant overlay (scale/variant_sfno_full.yaml), same
# loss preset, same eval protocol. The variables under test are the ones the
# ACE2 paper says matter most, in order of expected effect:
#
#   1. DATA (the dominant gap). 36 years x 4 seasonal 2-day windows =
#      288 train days = 1,152 6-hourly IC/target pairs, vs 20 days / 80
#      pairs at the short tier (14.4x). ACE2 trains on ERA5 1940-1995 +
#      2011-2019 + 2021-2022 (~24,000 days, ~6,000 iterations/epoch x 120
#      epochs), so this is still ~80x short of ACE2 — but 14.4x more than
#      what we had. Affordable here because sfno_full runs NO dycore and NO
#      RRTMGP: cost is dominated by sample count, not by a differentiated
#      physics column, and the loop is host-staged (#1155) so the window set
#      lives in host RAM with only the active sample on the GPU.
#      SIZED BY MEASUREMENT, not ambition: the ERA5 window loader ran at
#      12.1 s/snapshot on 2026-07-27 (50/160 snapshots in 607 s, four jobs
#      contending for GCS). 288 days = ~1,300 snapshots = ~4.4 h of load,
#      which leaves training room inside the 11.25 h chain-link budget. The
#      720-day version (3,168 snapshots, ~10.6 h) does NOT fit a first link
#      and would produce no checkpoint at all. Raise the window length once
#      LEGOESM_ERA5_WINDOW_CACHE has a warm store to read from.
#   2. OPTIMIZER (ACE2 Table 7): AdamW, weight decay 0.01, LR 1e-4,
#      EMA decay 0.999 (ACE2 averages parameters across training steps and
#      evaluates the averaged weights; our D3 EMA + evaluate-the-EMA doctrine
#      is exactly this, but aimip_ema_decay defaults to 0.0 = OFF, so every
#      previous arm trained without it).
# CAPACITY IS DELIBERATELY *NOT* A LEVER HERE. Architecture stays at the
# shared overlay's 64-wide / 4-block SFNO (68,294,754 params at T63, logged),
# identical to the short-tier suite, so this pair is a clean single-variable
# comparison: training-set size (+ the optimizer block, which both share).
# Mechanical reason it could not be a lever anyway: run_aimip merges
# `base <- cfg_overrides <- variant_<v>.yaml`, so the VARIANT OVERLAY WINS —
# an `sfno_embed_dim:` in cfg_overrides is silently dead. (Confirmed on
# 2026-07-27: a suite setting 96/8 still logged `64d, 4 blocks`.) Raising
# capacity requires its own suite directory with its own variant overlay;
# ACE2 runs embed_dim 384 / num_layers 8 = 450M params, 6.6x this arm.
#
# Held to ACE2 already by the ace2 loss preset: pure MSE, residual (6-h
# tendency) normalization on prognostics, loss summed over two autoregressive
# 6-h steps.
#
# Known REMAINING divergences from ACE2 (stated, not silently dropped):
#   * LR schedule: ACE2 uses none (constant 1e-4); create_optimizer only
#     offers warmup -> cosine.
#   * Per-variable loss weights: ACE2 upweights Z500 x10, T850 x5,
#     ULWRFsfc x5, radiative fluxes x2 and downweights mid-level q x0.25.
#     LossConfig has no per-LEVEL weight, so the preset uses flat w_* +
#     pressure level weighting.
#   * Hard constraint corrector inside the training graph (global dry-air
#     mass via a constant ps offset, global-mean moisture via multiplicative
#     precip scaling, column-moisture closure via residual advective flux,
#     non-negativity clamps) — design D4, not yet a suite flag. sfno_full
#     applies a post-hoc dry-air-mass correction only.
#   * Checkpoint selection: ACE2 picks the checkpoint minimizing a CLIMATE
#     skill score (channel-mean global RMSE of time-means over eight 5-year
#     inference runs), not validation loss, and across 4 random seeds.
base: config/aimip/aimip_era5.yaml
cfg_overrides:
  loss_preset: ace2
  loss: {}
  aimip_optimizer: adamw
  aimip_lr: 0.0001
  aimip_weight_decay: 0.01
  aimip_ema_decay: 0.999
  aimip_n_epochs: 120
  aimip_patience: 20
  aimip_warmup: 200
  train_windows:
