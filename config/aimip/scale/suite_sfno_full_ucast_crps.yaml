# U-CAST STAGE 2: the CRPS probabilistic fine-tune.
#
# Resumes the muondrop stage-1 net (epoch_0059, copied into this arm's dir so
# the stage-1 reference is not overwritten) and switches the objective for the
# LAST 5 epochs: epochs 60-64 train unbiased CRPS with an M=2 MC-Dropout
# ensemble, matching U-Cast's "100 epochs MAE -> 8 epochs CRPS" curriculum in
# shape (ours is 60 -> 5) but keeping our MSE stage-1 loss, since MAE was
# REFUTED for z500 in arm 3.
#
# WHY THIS ARM EXISTS. MC-Dropout alone does NOT give a calibrated ensemble:
# 8 dropout members from the stage-1 net score spread-skill 0.23/0.16/0.18/0.43
# at 24/72/120/240 h, against 0.58/0.62/0.75/0.91 for an 8-seed ensemble
# (1.0 = calibrated). Dropout is the stochasticity SOURCE; the CRPS fine-tune
# is what teaches the model to use it. Stage 2 is REQUIRED, not optional.
#
# BASE IS muondrop (z500 24 h 18.88 m), NOT the better muonlr arm (16.35 m),
# because stage 2 requires sfno_dropout > 0 and muonlr trains at p=0. That
# costs ~15% deterministic skill and is accepted: this arm answers a
# CALIBRATION question, not an RMSE one.
#
#   CONFIRMS: spread-skill beats the 8-seed 0.58/0.62/0.75/0.91, and CRPS
#             improves against the stage-1 MC-Dropout ensemble.
#   REFUTES:  spread-skill still below the seed ensemble -> MC-Dropout is not
#             a usable stochasticity source at our scale and the deep ensemble
#             stays the only calibrated option.
base: config/aimip/aimip_era5.yaml
cfg_overrides:
  # ucast preset, not ace2: stage 2 builds its objective ONLY from the
  # w_crps_* family, and ace2 leaves every one of them at 0.0 (the trainer
  # refuses that config outright). The preset's zeroed MSE weights are
  # inert here because this arm resumes at epoch 60 and never runs a
  # stage-1 epoch.
  loss_preset: ucast
  loss: {}
  aimip_optimizer: muon_partitioned
  aimip_lr: 0.0001
  aimip_weight_decay: 0.01
  aimip_ema_decay: 0.999
  aimip_n_epochs: 65
  aimip_patience: 10
  aimip_warmup: 500
  train_windows:
  - [1979, 0, 5]
  - [1979, 30, 5]
