# ACE2-loss retrain suite (user request: "use the same loss as ACE2-ERA5").
#
# Replicates the ACE2 training loss in our spectral framework via
# cfg_overrides (shallow-merged over aimip_era5.yaml, so the loss block is
# REPLACED wholesale): RESIDUAL normalization (scale by std of the 6h field
# change, not full-field std), 2-step autoregressive supervision, flat
# per-variable weights, and PURE MSE (no bias/CRPS/spectral terms — those
# default to 0 in LossConfig). T63 + RRTMGP kept (aimip_era5.yaml base).
#
# Classical uses the SWEEP-WINNER schemes (edmf convection + louis +
# mcfarlane + sundqvist + xu_randall) via ace2/variant_classical.yaml;
# column_nn / sfno_physics use their standard overlays.
base: config/aimip/aimip_era5.yaml

cfg_overrides:
  aimip_n_epochs: 12          # 2-step RRTMGP at T63 is ~2x single-step;
                              # aimip_patience=3 early-stops at convergence.
  loss:
    # --- ACE2 loss ---
    residual_normalize: true  # scale by std of 6h Δ (ACE2 residual scaling)
    normalize_by_scale: false # superseded by residual_normalize
    multi_step_hours: [6, 12]      # 2 autoregressive 6h steps (ACE2)
    multi_step_weights: [1.0, 1.0] # equal weight per step (ACE2 sums them)
    w_T: 0.5
    w_u: 0.5
    w_v: 0.5
    w_q: 0.5
    w_ps: 0.3
    level_weighting: "pressure"
    # bias / CRPS / spectral weights omitted -> default 0.0 => pure MSE (ACE2)

variants:
  - classical
  - column_nn
  - sfno_physics

output_dir: results/aimip_ace2loss
