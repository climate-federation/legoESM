# CLASSICAL, lnps-fix + anchored, with the EXTENDED spec-driven parameter
# tier ON — one variable vs suite_classical_anchored_lnpsfix.yaml.
#
# Field-level ownership (2026-08-10) makes this add 25 NEW trainable leaves
# on the base combo: 5 ConvectiveEDMF (the active convection previously
# trained NOTHING), 10 CloudConfig, 5 Sundqvist (incl. qc_crit), 3
# OzoneProfile, McFarlane fcrit2, Louis b_heat_ratio — on top of the 68 live
# legacy leaves.
#
# The ozone trio (peak pressure, max VMR, width) is the arm's only INTERIOR
# radiative lever: RRTMGPConfig exposes zero trainable fields (every gas and
# aerosol value is a Python optics-cache key), so radiation was otherwise
# tunable only at the surface. Ozone sets stratospheric heating — a
# temperature-only control with no moisture coupling, which is the process
# class the q-good/T-drifting signature points at (user, 2026-08-10).
#
#   CONFIRMS: startup log reports 25 spec-driven parameters; training loss
#             at matched epoch+lead below the lnpsfix baseline, with the
#             bias_T term (99% of the stuck bias) the one that moves.
#   REFUTES:  no loss improvement -> the missing EDMF/cloud/ozone knobs were
#             not the binding constraint on the classical arm.
base: config/aimip/aimip_era5.yaml

cfg_overrides:
  loss_preset: ace2_curriculum
  loss: {}
  fix_mass: true
  anchor_mass_to_initial: true
  aimip_surface_bulk_scheme: most
  aimip_spatial_surface: true
  aimip_trainable_schemes: extended
  aimip_rollout_curriculum:
    - [12, 3]
    - [24, 3]
    - [72, 3]
    - [120, 2]

variants:
  - classical

output_dir: results/aimip_classical_lnpsfix_ext
