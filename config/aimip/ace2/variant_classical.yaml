# ACE2-loss classical: the sweep-WINNER scheme combination
# (combo_conv_edmf: edmf convection + louis + mcfarlane + sundqvist +
# xu_randall, RRTMGP from the base). Differs from the standard
# variant_classical (tiedtke) by using the winning schemes. Every family is
# filled, as a classical model now requires.
aimip_variant: "classical"
aimip_convection: "edmf"
aimip_turbulence: "louis"
aimip_gwd: "mcfarlane"
aimip_microphysics: "sundqvist"
aimip_cloud: "xu_randall"
# radiation: removed 2026-08-12 — WB/AIMIP always use rrtmgp, set once in the
# base config (aimip_radiation). The deleted key was an informational tag that
# named a backend the run did not use; keeping "gray" in a campaign overlay
# only invited someone to wire it up.
physics_parameterization: "none"
