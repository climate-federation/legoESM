# COLUMN_NN ARM B: the DATA tier, and nothing else.
#
# Controlled against config/aimip/ace2/suite_curriculum_v2.yaml (z500 24 h
# 90.9 m), changing exactly one thing -- how much ERA5 the arm sees:
#
#     20 train days (4 windows, 2015-2016) -> 288 train days (144 windows,
#     1979-2014, 4 seasonal windows x 2 days x 36 years)
#
# WHY THIS ONE. Data volume is the only lever that has ever moved an arm by
# more than a few percent in this campaign: on sfno_full, 20 -> 288 days took
# z500 24 h from 89.5 m to 38.9 m (2.3x) while 6x the parameters and 3
# resolution steps changed nothing outside noise. column_nn has never been
# trained on more than 20 days.
#
# eval_windows / n_eval_days / eval_year are pinned back to aimip_era5.yaml's
# values -- i.e. v2's -- because they came along with the copied window list and
# would have scored the two arms on DIFFERENT held-out sets (codex 2026-08-08).
#
# EVERYTHING ELSE IS HELD AT v2: T63 (n_max 63, dt 600 from aimip_era5.yaml,
# NOT the T106/dt400 of base_t106_allyears.yaml, which is where this window
# list is copied from), the same 11-epoch 6/12/24/72/120 h rollout curriculum,
# the same ace2_curriculum_sharp loss, the same AdamW at 3e-4.
#
# COST + CACHE: 4032 ERA5 snapshots. The window list is byte-copied from
# base_t106_allyears.yaml precisely so it hits the cache the CLUBB classical
# arm already downloaded (.cache/aimip_era5/ywin_1979_2015_d18c44a6efdffd95),
# instead of paying the ~4.8 h GCS load again. At v2's measured 3.3 h for 11
# epochs on 20 days this is ~48 h of training = 4-5 chain links.
#
#   CONFIRMS: z500 24 h below 90.9 m on the SAME 8-init eval protocol.
#   REFUTES:  no better -> column_nn is structure-limited, not data-limited,
#             and the dycore+MLP hybrid cannot be closed on ERA5 volume alone.
base: config/aimip/aimip_era5.yaml
cfg_overrides:
