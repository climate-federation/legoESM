# Canonical coupled CMIP run — full prognostic 3D ocean (LatLonCGridOceanModel)
# from realistic WOA18 initial conditions.
#
#   source config/amip/amip_production.ginsburg.sh
#   run_coupled.py "${CMIP_PATH_FLAGS[@]}" "${CMIP_LAND_PATH_FLAGS[@]}" \
#       --config config/cmip/cmip_ocean_3D.yaml
#
# The dynamic-ocean twin of config/cmip/cmip_ocean_slab.yaml (user 2026-11-25:
# same recipe): it INCLUDES the slab deck, so the atmosphere, its own land model
# and open-water exchange (atmosphere-owned surface on the column lane), the
# timestep and cadence are the slab deck's rows; only the ocean differs.  NEW
# 3-D BASELINE: not comparable with runs of the earlier 3-D deck (coupler land
# tile, Sundqvist/SBM atmosphere, ocean-derived land fraction).
#
# Land/sea partition: the atmosphere's land-mask file; cells the 3-D ocean holds
# dry are land for the atmosphere too (user decision 2026-11-25, option 1).
#
# The cold-collapse fix = WOA surface T/S Newtonian restoring (the tau below): a
# free 3D ocean from realistic WOA T/S cold-collapses when the dry cold-start
# atmosphere radiates away the warm ocean heat faster than it re-equilibrates;
# the restoring holds the surface near observed climatology while the atmosphere
# spins up.  Requires --grid latlon (the 3D ocean co-locates with the atm grid).
#
# Precedence: an explicit CLI flag > this file > the included base > parser default.

include: cmip_ocean_slab.yaml

# --- ocean: prognostic 3D from WOA18 IC + surface restoring (the stabilizer) ---
ocean: dynamic
ocean_ic: woa                  # WOA18 T/S initial condition (data/woa18/)
ocean_nlev: 20
ocean_dt: 300.0                # ocean sub-step [s]
ocean_restore_sst_tau_days: 5.0
ocean_restore_sss_tau_days: 30.0
# The atmosphere builds its own surface boundary under atm_owns_surface, which
# refuses the coupler's tile-blended surface radiation.
couple_surface_radiation: false
