# Canonical coupled CMIP run — SLAB (two-layer) ocean.
#
#   source config/amip/amip_production.ginsburg.sh
#   run_coupled.py "${CMIP_PATH_FLAGS[@]}" --config config/cmip/cmip_ocean_slab.yaml
#
# Inherits the tuned ("trained") atmosphere + air-sea physics from
# cmip_tuned_physics.yaml (the single source of truth for the converged values);
# this file adds only the run orchestration + the ocean choice.  The two-layer
# slab (mixed + deep restoring layer) is the cheap, stable, energy-balanced
# Earth-like reference (R_TOA ~-0.7 W/m2 at 180 d); the dynamic-3D-ocean twin is
# config/cmip/cmip_ocean_3D.yaml (same physics base, only the ocean differs).
#
# Precedence: an explicit CLI flag > this file > the included base > parser default.

include: cmip_tuned_physics.yaml

# --- run orchestration ---
preset: slab_richards          # Richards multilayer soil -> water-limited ET
grid: latlon
resolution: 24
nlev: 20
# hybrid B(eta)=eta**2: holds all of ETOPO (exponent 3 carries negative layer
# mass below ~658 hPa, i.e. over Tibet, once real terrain is on; F36, vote
# 2026-10-10).
transition_exponent: 2
dt: 300.0
ic: standard
days: 240
diag_days: 10                  # atm<->ocean coupling cadence

# --- land: the coupler's land tile takes its land FRACTION from the terrain
# product the launcher passes (--topography, F36).  With flat terrain (no
# --topography) it falls back to the analytic 50%-poleward-of-25-deg band,
# which has no tropical continents.

# --- ocean: two-layer thermodynamic slab ---
ocean: two_layer

# --- CMIP6 historical forcing SCHEMES (F40): the same selectors as
# config/amip/amip_production.yaml.  File PATHS are machine-specific and come
# from the launcher (CMIP_PATH_FLAGS in config/amip/amip_production.ginsburg.sh:
# ozone/solar/GHG/aerosol/CCN/volcanic files, plus terrain + subgrid orography,
# F36).  Without the forcing file paths this deck refuses to start (no idealized
# forcing under a "historical" label).  Volcanic aerosol is on when the launcher
# passes its file; its LW toggle follows the launcher's AMIP_VOLCANIC_LW policy.
ozone_forcing: external
solar_source: spectral_file
solar_tsi_var: TSI
solar_spectral_var: SSI_frac
solar_spectral_band_order: rrtmg_sw
ghg_forcing: external
aerosol_forcing: external
diurnal_cycle: true            # coupler takes segment-MEAN surface radiation (F35)
orbital_insolation: true
rrtmgp_overhead_layer: true

# --- CMOR output (historical-1850 forcing) ---
experiment: historical
start_year: 1850
cmip_output: true
cmip_resolution_deg: 5.0
