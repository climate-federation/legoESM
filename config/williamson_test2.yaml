# legoESM configuration: Williamson Test Case 2 (shallow water).
# Same matrix-case form as config/templates/2d/williamson2_sw.yaml; run it with
#   scripts/experiment/init_experiment.py 2d/williamson2_sw --name w2 --output-dir ./runs/w2
experiment:
  tier: tier1
  complexity: shallow_water
  extent: global
  maturity: run_tested
  description: >
    Williamson (1992) Test Case 2 — steady geostrophic flow; the canonical
    shallow-water dycore accuracy/stability check. No external data needed.
  data: []
  conservation_gates: [mass, energy]
model:
  name: "Williamson Test Case 2"
  type: atmosphere_only
setup:
  name: williamson2
  grid: cubed_sphere
output:
  path: output/williamson_test2/
