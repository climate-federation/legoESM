# legoESM experiment template — Williamson Test Case 2
# Steady-state nonlinear zonal geostrophic flow (global shallow-water).
#
# Names the `williamson2` idealized atmosphere matrix case via the `setup:`
# selector (#388). Routes (exact match) to:
#   run_atmosphere_test_matrix.py --test =williamson2 --grid cubed_sphere
# `legoesm run` does not run shallow water (ModelDriver builds a primitive-
# equation state), so the grid, timestep and duration are the matrix case's.
#   scripts/experiment/init_experiment.py 2d/williamson2_sw --name w2 --output-dir ./runs/w2
experiment:
  tier: tier1
  complexity: shallow_water
  extent: global
  maturity: run_tested
  description: >
    Williamson (1992) Test Case 2 — steady geostrophic flow; the canonical
    shallow-water dycore accuracy/stability check. No external data needed.
  data: []
  conservation_gates: [mass, energy]
model:
  name: "Williamson Test Case 2"
  type: atmosphere_only
setup:
  name: williamson2
  grid: cubed_sphere
output:
  path: output/williamson_test2/
