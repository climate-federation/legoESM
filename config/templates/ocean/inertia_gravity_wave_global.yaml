# legoESM experiment template — inertia-gravity wave, global case.
#
# Names the procedural `inertia_gravity_wave` experiment via the `setup:`
# selector (#388 Ask#2). Exact match: run_ocean_test_matrix.py --only =inertia_gravity_wave.
# init_only (#2114): a constant-f0 plane wave on the sphere is not an
# eigenmode, so no wave-speed gate is constructible on this case. The
# verified lane is the f-plane channel (inertia_gravity_wave.yaml).
experiment:
  tier: tier1
  complexity: primitive_equation
  extent: idealized
  maturity: init_only
  description: >
    Inertia-gravity (Poincaré) wave propagation: a barotropic-equivalent
    shallow-water benchmark of the C-grid IGW dispersion relation and the
    Coriolis / free-surface pressure-gradient coupling. A low-tier dynamical
    sanity setup. On the sphere the constant-f0 wave is not an eigenmode, so
    no wave-speed gate is constructible here (#2114).
  data: []
  conservation_gates: [volume]
model:
  name: "ocean-inertia-gravity-wave-global"
  type: ocean_only
setup:
  name: inertia_gravity_wave
  grid: latlon
output:
  path: output/ocean/inertia_gravity_wave/
