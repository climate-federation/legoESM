# legoESM experiment template — AMIP (prescribed observed SST/sea-ice).
experiment:
  tier: tier3
  complexity: hydrostatic
  extent: global
  maturity: init_only        # validates + constructs; needs SST forcing data to RUN
  description: >
    AMIP-style run: hydrostatic atmosphere forced by prescribed observed SST +
    sea-ice (operational tier). Requires an external SST/SIC forcing dataset
    (fetch first); the config itself validates without the data present.
  data: [amip_sst_sic]       # fetch_data.py stages this before a run
  conservation_gates: [mass, energy, moisture]
model:
  name: "AMIP"
  type: atmosphere_only
grid:
  type: cubed_sphere
  resolution: 48
  n_levels: 26
  vertical_coord: hybrid
atmosphere:
  dynamics: hydrostatic        # canonical key -> ExperimentConfig.dycore.model_type
  time_integrator: ssp_rk3
  dt_seconds: 450
  hyperdiff_scale: 0.0
conservation:
  fix_mass: true
  fix_energy: false
time:
  duration_hours: 8760         # 1 year
  output_interval_hours: 24
output:
  format: zarr
  path: output/amip/
hardware:
  precision:
    dynamics: float32
  devices: auto
