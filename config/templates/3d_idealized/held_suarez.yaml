# legoESM experiment template — Held-Suarez (1994) dry dynamical-core benchmark.
experiment:
  tier: tier2
  complexity: hydrostatic
  extent: global
  maturity: run_tested
  description: >
    Held-Suarez (1994) — Newtonian relaxation to a zonally-symmetric radiative
    equilibrium + Rayleigh boundary drag; the standard dry-dynamical-core
    climate benchmark. No external data; intermediate tier.
  data: []
  conservation_gates: [mass, energy, aam]
model:
  name: "Held-Suarez"
  type: atmosphere_only
grid:
  type: cubed_sphere
  resolution: 36
  n_levels: 26
  vertical_coord: hybrid
atmosphere:
  dynamics: hydrostatic        # canonical key -> ExperimentConfig.dycore.model_type
  advection: ppm
  time_integrator: ssp_rk3
  dt_seconds: 600
  hyperdiffusion_coeff: 0.0
physics:
  forcing: held_suarez
conservation:
  fix_mass: true
  fix_energy: false
time:
  duration_hours: 2400          # 100 days (spin-up)
  output_interval_hours: 24
output:
  format: zarr
  path: output/held_suarez/
hardware:
  precision:
    dynamics: float32
  devices: auto
