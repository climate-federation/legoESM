# legoESM experiment template — Held-Suarez (1994) dry dynamical-core benchmark.
experiment:
  tier: tier2
  complexity: hydrostatic
  extent: global
  maturity: run_tested
  description: >
    Held-Suarez (1994) — Newtonian relaxation to a zonally-symmetric radiative
    equilibrium + Rayleigh boundary drag; the standard dry-dynamical-core
    climate benchmark. No external data; intermediate tier.
  data: []
  conservation_gates: [mass, energy, aam]
model:
  name: "Held-Suarez"
  type: atmosphere_only
grid:
  type: cubed_sphere
  resolution: 36
  n_levels: 26
  vertical_coord: hybrid
atmosphere:
  dynamics: hydrostatic        # canonical key -> ExperimentConfig.dycore.model_type
  time_integrator: ssp_rk3
  dt_seconds: 600
  hyperdiff_scale: 0.0
physics:
  forcing: held_suarez
  # Held-Suarez is a DRY benchmark, and HS forcing is ADDITIVE to the physics
  # pipeline (model_driver: "HS is ADDITIVE ... a held_suarez_forcing + louis
  # config would apply BOTH the Louis surface stress AND this Rayleigh drag").
  # So the whole moist stack must be declared off, matching run_amip's rule that
  # HS is exempt from full-physics only when the ENTIRE stack is dry
  # (_AMIP_REQUIRED_PHYSICS). These were previously omitted and the block was
  # silently discarded, so this template ran moist sbm convection + gray
  # radiation with NO Held-Suarez forcing at all.
  convection: none
  microphysics: none
  turbulence: none          # also gates the defining HS Rayleigh surface drag
  clouds: none
  gravity_wave_drag: none
  radiation: none           # HS Newtonian relaxation REPLACES radiative heating
surface:
  # Held-Suarez is a DRY core, but the driver initializes moisture
  # UNCONDITIONALLY from rh_init (model_driver: q_v = rh_init * q_sat * sigma^2,
  # canonical default 0.7).  Disabling the moist parameterizations above leaves
  # that q_v in place as a passive tracer that still perturbs the dynamics
  # through virtual temperature -> density.  Start genuinely dry.
  rh_init: 0.0
conservation:
  fix_mass: true
  fix_energy: false
time:
  duration_hours: 2400          # 100 days (spin-up)
  output_interval_hours: 24
output:
  format: zarr
  path: output/held_suarez/
hardware:
  precision:
    dynamics: float32
  devices: auto
