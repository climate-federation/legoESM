# legoESM Configuration: Williamson Test Case 5
# Zonal flow over an isolated mountain

model:
  name: "Williamson Test Case 5"
  type: atmosphere_only

grid:
  type: cubed_sphere
  resolution: 48              # C48 ~ 200 km
  n_levels: 1
  vertical_coord: none

atmosphere:
  dynamics: shallow_water      # canonical axis (was the legacy 'equations' key)
  time_integrator: ssp_rk3
  dt_seconds: 600             # 10 minutes
  hyperdiff_scale: 0.0

conservation:
  fix_mass: true
  fix_energy: true

time:
  duration_hours: 360          # 15 days
  output_interval_hours: 6

output:
  format: zarr
  path: output/williamson_test5/

hardware:
  precision:
    dynamics: float32
  devices: auto
