# legoESM configuration: Williamson Test Case 5 (shallow water).
# Same matrix-case form as config/templates/2d/williamson5_sw.yaml; run it with
#   scripts/experiment/init_experiment.py 2d/williamson5_sw --name w5 --output-dir ./runs/w5
experiment:
  tier: tier1
  complexity: shallow_water
  extent: global
  maturity: run_tested
  description: >
    Williamson (1992) Test Case 5 — zonal flow impinging on an isolated
    mountain; exercises orographic forcing + gravity-wave generation in the
    shallow-water dycore. No external data needed.
  data: []
  conservation_gates: [mass, energy]
model:
  name: "Williamson Test Case 5"
  type: atmosphere_only
setup:
  name: williamson5
  grid: cubed_sphere
output:
  path: output/williamson_test5/
