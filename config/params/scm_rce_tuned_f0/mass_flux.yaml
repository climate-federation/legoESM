# SCM-RCE tuned parameters for convection=mass_flux
# corrected nonrotating protocol (coriolis=0), median of 5 seeds.
# NON-IDENTIFIABLE for multi-parameter schemes: the spread comment on each
# line is how far the seeds disagreed. A large spread means the median is one
# point in a flat basin, not a calibrated value. Opt in with --params; this
# file never mutates a production *Config default.

atm.conv.MassFluxConfig.M_b_max: 0.0760362  # default 0.05, seed-spread 86% of range, kg/m^2/s
atm.conv.MassFluxConfig.M_scale: 0.0273923  # default 0.01, seed-spread 31% of range, kg/m^2/s
atm.conv.MassFluxConfig.cape_activation_scale: 19.9852  # default 10, seed-spread 58% of range, J/kg
atm.conv.MassFluxConfig.cape_threshold: 153.353  # default 70, seed-spread 72% of range, J/kg
atm.conv.MassFluxConfig.delta_0: 0.00227775  # default 0.001, seed-spread 67% of range, 1/m
atm.conv.MassFluxConfig.tau_adj: 7925.24  # default 3600, seed-spread 90% of range, s
