# Production deck with CAM-FV PPM vertical transport on the MPAS hybrid lane.
#
# PPM is wired into the MPAS LEGACY vertical form only (the shared PE core,
# vertical_form as83 in production, refuses it), so this arm also sets
# vertical_form: legacy.  Its matched baseline is therefore NOT
# amip_production.yaml but that deck run with --vertical-form legacy; the
# A/B compares legacy+ppm against legacy+sb and says nothing about as83.
# 'ppm' replaces 'sb' for temperature (CAM-FV te_map: T_v over ln p, kord 4)
# and for every tracer (kord 7, positive definite); the limiter's branch
# decisions are smooth at the default sharpness (RULE 5).  Ported from the
# ENSO fork (Isma Di Carlo).  Not a production candidate.
include: amip_production.yaml
vertical_form: legacy
mpas_vert_advection_scheme: ppm
tracer_vertical_scheme: null   # PPM transports tracers; the parent's van_leer would be inert (refused)
mpas_vert_ppm_limiter_sharpness: 10000.0   # = DycoreConfig default; written so the arm records it
