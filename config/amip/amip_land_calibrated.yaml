# AMIP land overlay — run the land model the parameters were actually fitted to.
#
# WHAT THIS SELECTS. The biophysics LMIP calibration: a two-leaf canopy with
# MOST surface exchange, its own Ball-Berry stomata, and a 3 m soil column in
# ten geometrically growing layers, together with the per-plant-type root depth,
# wilting point and field capacity, and the snow and glacier albedo settings
# that calibration produced. Its offline definition is
# ``templates/land/biophysics/lmip_biophys_2deg.yaml`` — a 10-year, 2-degree
# CRU-JRA run scored against observed land fluxes.
#
# WHY. AMIP previously deployed a DIFFERENT calibration — one fitted under the
# bulk surface energy balance (SimpleSEB) — inside a coupled run. Parameters
# fitted under one surface scheme and run under another give wrong surface
# fluxes, which is where the land precipitation bias came from. AMIP no longer
# has a route to that pairing; the older bake remains in the land package only
# for reproducing old OFFLINE runs.
#
# THE KEYS BELOW ARE CHECKED, NOT OVERRIDDEN. They overlap the calibration, so
# stating them here means a typo fails the run instead of quietly changing the
# land physics. The settings with no config key of their own — soil growth
# factor, the canopy's intrinsic stomata, the albedo scalars — come from the one
# shared definition, so the fitted model and the deployed model cannot drift.
#
# THE SOIL STATE IS NOT INCLUDED, AND MATTERS. The calibration's spun-up soil
# came from a 2-degree lat-lon run; the restart loader compares column counts
# and refuses a mismatch, so it cannot be read onto a mesh. Spin the same
# configuration up on the grid the AMIP run uses, then pass the result:
#
#   # NOTE the shipped spin-up config still selects the LEGACY land model
#   # (SimpleSEB, 8 layers), so its restart carries the wrong soil column and
#   # THIS run refuses it. The spin-up has to be re-cut on the model below
#   # before the --land-ic line is usable; until then the run cold-starts.
#   python scripts/run/run_lmip_biophys.py \
#       --config <a spin-up config on THIS land model> \
#       --output-dir results/land/land_spinup_calibrated
#   python scripts/run/run_amip.py --config config/amip/amip_production.yaml \
#       --use-multilayer-land --land-calibrated-physics --snow-albedo-feedback \
#       --mpas-land-beta-soil --land-surface-scheme two_leaf \
#       --multilayer-n-layers 10 --multilayer-soil-depth 3.0 \
#       --land-ic results/land/land_spinup_calibrated/<restart>.npz
#
# Started cold instead, the soil column is out of balance and the first weeks of
# land evaporation are the spin-up, not the calibration.
#
# ON A CUBED-SPHERE OR LAT-LON GRID, pass --surface-tiled instead of
# mpas_land_beta_soil below: the land tile's humidity carries the canopy
# conductance to the air only through the mosaic surface. The non-tiled path
# runs one scheme on a blended surface temperature at saturation, where a plant
# conductance has nothing to act on, and validation refuses that combination
# rather than half-applying it.
#
# STILL UNPROVEN COUPLED. The offline fit says these parameters are unbiased in
# evaporation and skin temperature. The previous bake said that too and then
# lost two thirds of its tropical evaporation once coupled. Treat the first run
# as one arm of a controlled pair against the current default, changing only
# this overlay, and read land evaporation, land rain, top-of-atmosphere balance
# and soil-moisture drift before adopting it.
use_multilayer_land: true
land_calibrated_physics: true
# WITHOUT THIS THE MESH LANE THROWS THE PLANT MODEL AWAY. The mesh (Voronoi/MPAS)
# lane solves the land tile's humidity and fluxes and publishes them to the
# atmosphere only under this switch; with it off the atmosphere keeps a static
# evaporation efficiency of 0.6 and the canopy changes the land tile's own
# temperature and nothing else. Validation refuses a calibrated mesh run
# without it.
mpas_land_beta_soil: true
land_surface_scheme: two_leaf
# The canopy carries its own Ball-Berry stomata; a coupled stomatal beta on top
# throttles the same conductance twice, and the calibration ran without one.
land_stomatal_beta: false
multilayer_n_layers: 10
multilayer_soil_depth: 3.0
snow_albedo_feedback: true
