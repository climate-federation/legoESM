# =============================================================================
# legoESM AMIP -- the CAM6 production deck on the FV3 DUO column lane, C24 L32
# =============================================================================
# This deck IS config/amip/amip_production.yaml (the MPAS res6 deck), included
# below, plus ONLY this lane's own rows that follow it (grid / dycore, its land
# IC file, its GPU radiation batch).  Every physics, land, forcing and output
# row is inherited, so it cannot drift from MPAS: the six rows
# that had drifted here (two_region optics, max_random overlap, land every 300 s,
# grid-mean warm rain, soil freeze/thaw off, no land IC) and the unset tunables
# (zm_*, clubb_*, cloud_cam6_rh*, canopy smoothing / MOST iterations) now come
# from the MPAS deck (review 2026-10-10, finding F32 / ledger D0).
# tests/unit/test_run_amip_cli.py resolves both decks and fails if any key
# outside that list of own rows differs.
#
# The overrides are the user-approved deck ledger (2026-10-01,
# fv3_duo_gaps/q_review/deck_ledgers.md): A dt by MPAS's CFL rule, B1 top
# sponge, B2 del-4 divergence damping, B3 fillz + positivity, B4/B5 MPAS-only
# dycore rows off, C one terrain product per grid; plus the land IC on this
# lane's own columns and the GPU radiation batch.
include: amip_production.yaml

# ---- grid / dycore ----------------------------------------------------------
grid_type: cubed_sphere
resolution: 24              # C24 L32: 462 km centre / 327 km corner cells (deck ledger A)
discretization: fv3_duo
fv3_duo_column_lane: true   # route A: the duo is the dynamics operator of the CAM6 loop
dt: 300.0                   # decision A: MPAS's rule (0.82 of the printed CFL clamp, a divisor of 1800) -> C24 300 s; ladder 225/300/360 s
physics_update_steps: 6     # CAM6: physics every 1800 s (6 x 300 s); ladder arms pass 1800/dt
rad_update_steps: 12        # CAM6 f09: radiation hourly (12 x 300 s); ladder arms pass 3600/dt

# ---- duo dynamics knobs (deck ledger B) -------------------------------------
# B1 top sponge: MPAS's 2-layer momentum del-2 (x8) is replaced by the duo's
#    additive del-2 on divergence AND vorticity, equal coefficients, MATCHED to
#    MPAS's total top del-2 at 8dx by measurement (only value inside the 10 %
#    gate: div -9.8 %, rot +7.9 %).
fv3_duo_sponge_layers: 2
fv3_duo_sponge_factor: 8.0
fv3_duo_sponge_d2_top: 0.0016
# B2 divergence damping: FV3's 4th-order arm with d4_bg MATCHED to MPAS ldiv4
#    (2-cell divergence-mode e-folding, 3.0 %/step on 4dx).
fv3_duo_nord: 1
fv3_duo_d4_bg: 0.05
# B3 positivity: FV3 fillz in the remap + the MPAS borrow positivity stage every
#    step on the column lane (mpas_conservative_tracer_clamp, inherited).
fv3_duo_fill: true
# The MPAS deck's own dycore rows, replaced by B1/B2/B4/B5 above; each would be
# refused (or silently inert) on discretization fv3_duo, so they are set OFF
# here, at the values the duo resolved to before this deck included MPAS.
mpas_sponge_del2_top_layers: 0     # B1: the duo sponge above replaces it
mpas_sponge_del2_top_factor: 1.0
mpas_div_damp4_scale: 0.0          # B2: fv3_duo_nord / fv3_duo_d4_bg replace it
mpas_vert_advection_scheme: upwind # B4: no FV3 counterpart (vertically Lagrangian + kord remap)
mpas_qv_smooth_del4_m4s: 0.0       # B5: OFF on the duo (no FV3 counterpart)

# ---- land initial state on THIS lane's columns ------------------------------
# The MPAS deck's land IC is on the res-6 Voronoi cells.  This one is the same
# recipe -- the published 2-deg LMIP spin-up (Zenodo 21986853) regridded by
# nearest land neighbour, then soil TEMPERATURE replaced by ERA5 1979-01-01
# 00 UTC stl1-4 on non-glacier land (here read from the ARCO-ERA5 0.25 deg
# store; the MPAS file read the N320 GRIB: same analysis instant, vote
# 2026-10-10) -- onto the duo column mesh (its six faces' A-grid centres,
# face-major: the order the driver steps, NOT the generic cubed sphere, whose
# centres differ and come in another order).  Built by
# scripts/data/regrid_land_ic.py --target-grid fv3_duo --target-resolution 24;
# provenance is in the file's metadata.  data/ is gitignored: stage the file
# in the launch directory.
land_ic: data/lmip_soil_ic/soil_ic_fv3duo24_era5T_19790101.npz

# ---- hardware ---------------------------------------------------------------
rrtmgp_gpoint_batch_size: 16  # this lane runs on GPU (A100): the 16-wide vmap
                              # block, not the MPAS deck's CPU-measured 0 (the
                              # per-g-point checkpointed scan, which compiles a
                              # distinct body per g-point; the RRTMGPConfig
                              # comment records the block ~26x faster).  Fluxes
                              # differ only by summation order (<= 6.1e-4 W/m2,
                              # MPAS deck measurement on CPU).  Vote 2026-10-10.
