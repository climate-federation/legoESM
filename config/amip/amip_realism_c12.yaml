# =============================================================================
# legoESM AMIP — realism-campaign RESTART config (cheap C12 iteration)
# =============================================================================
# Purpose: resume the AMIP full-physics realism work at low cost. This mirrors
# the PHYSICS of the VALIDATED config/amip/amip_production.yaml — the key being
# **SBM convection**, which fixes the structural over-bright (~2x albedo) and
# too-dry (~4x precip) biases that the tiedtke path does NOT (see
# docs/atmosphere/amip_realism_investigation.md) — but at C12/L20 with the WOA
# observed-SST forcing for fast turnaround before scaling to the C48/L40
# production config.
#
# Run:
#   run_amip.py --config config/amip/amip_realism_c12.yaml \
#     --forcing-path forcing_amip_woa/sst_sic_amip_1979-2014.nc \
#     --days 45 --output DIR
#
# Keys are run_amip argument DESTS; explicit CLI flags still override. Paths are
# NOT pinned (machine-specific) — pass --forcing-path on the CLI.
# =============================================================================

# --- Grid + dycore: coarse C12/L20 for cheap iteration -----------------------
grid_type: cubed_sphere
resolution: 12
nlev: 20
dt: 450.0

# --- Radiation ---------------------------------------------------------------
radiation: rrtmg            # rrtmgp builder alias (true CMIP6 RT)
rad_update_steps: 6

# --- Atmospheric physics: SBM convection = THE FIX ---------------------------
# tiedtke gives the non-precipitating overcast trap (albedo ~0.8); SBM is the
# scheme validated realistic in amip_production.yaml (albedo 0.292, precip 3.2).
convection: sbm
microphysics: morrison
clouds: sundqvist
turbulence: louis           # Louis required by the tiled/coare3 surface
gravity_wave_drag: hines

# --- Cloud tuning (== cmip_tuned_physics.yaml / amip_production.yaml) ---------
cloud_q_c_diagnostic: 3.0e-4
convective_cloud: true

# --- Surface: COARE3 bulk fluxes + convective gustiness ----------------------
surface_bulk_scheme: coare3
surface_gustiness_zi: 300.0

# --- Initial condition: realistic (dry) moisture -----------------------------
# rh_init default 0.7 gives IC CWV ~85 (3.4x Earth ~25) which triggers the
# overcast trap; 0.25 starts near a realistic CWV ~30.
rh_init: 0.25

# --- Forcing / output --------------------------------------------------------
dataset: hadisst            # sst_var 'sst' degC; pass --forcing-path (WOA builder)
diag_days: 5
monthly_means: true
cmip_output: true
clear_sky_diag: true
