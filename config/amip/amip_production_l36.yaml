# Raised-lid experiment deck (2026-09-16, user decision 3b): the production
# AMIP deck with the model lid raised from 10 hPa to 2 hPa.
#
# Everything is inherited from amip_production.yaml except the five keys
# below.  The vertical grid keeps the production L30 troposphere bit-identical
# (27 layers of 33 hPa below sigma 0.109) and replaces its top three layers by
# nine layers uniform in ln(sigma) up to 2 hPa (2.0-3.1, 3.1-4.9, 4.9-7.6,
# 7.6-11.8, 11.8-18.4, 18.4-28.7, 28.7-44.8, 44.8-69.9, 69.9-109 hPa at
# 1000 hPa surface pressure, ~3 km each; CAM6-L32-like spacing).  Why: with
# the 10 hPa lid the top 33-hPa layer received 29 % of the global
# gravity-wave momentum sink and sat 18 K too cold, and the midlatitude
# 100-150 hPa layer ended 3-6 K cold once the numerical warming of the old
# vertical advection was removed (PR #1758); a resolved lower stratosphere is
# the structural fix, relaxing to reanalysis is not an option for CMIP runs.
#
# The sponge is CAM's "del2 sponge": the horizontal momentum viscosity is
# raised x8 in the top layer, x4 and x2 in the next two (geometric ramp); it
# damps resolved waves reaching the lid (2000-km amplitude e-folding ~1.6 d
# at the top) without the Rayleigh drag's direct relaxation of the mean flow,
# though a vector Laplacian still dissipates mean-flow shear and kinetic
# energy (no dissipative heating is added; the process ledger excludes
# kinetic energy, so this sink is untracked exactly like the baseline
# del2/del4 dissipation; mean-flow damping by the x8 top-layer Laplacian on
# a 2000-km jet is ~0.06 m/s/day, ~1e-3 W/m2).  The sponge scales the del2 term
# only (CAM-FV style); the del4 hyperdiffusion keeps its production
# strength in the top layers, and the e-folding quoted above assumes the
# inherited A_h (a_h_scale 0.375; a_h_scale 0 would make the sponge inert,
# which validate_strict refuses).  First setting, not a tuned one.
# Gravity-wave drag, radiation, physics: unchanged -- which means the
# Hines/McFarlane settings calibrated against the 10 hPa lid (where the
# top layer absorbed the momentum that now reaches 2-10 hPa) are
# UNVALIDATED on this grid: the 30-day pair shows the NH winter polar
# stratosphere +7-10 K and the SH summer pole -5..-8 K at 5-30 hPa
# against the February climatology, under diagnosis.
include: amip_production.yaml
nlev: 36
sigma_top: 0.002
sigma_layout: l30_trop_logstrat
mpas_sponge_del2_top_layers: 3
mpas_sponge_del2_top_factor: 8.0
