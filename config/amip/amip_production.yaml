# =============================================================================
# legoESM AMIP — AUTHORITATIVE production configuration (Pierre's reference)
# =============================================================================
# Run with:
#   run_amip.py --config config/amip/amip_production.yaml \
#       <machine path flags> --days N --output DIR
#
# Keys are run_amip argument DESTS; any explicit CLI flag still overrides. Machine
# PATHS (ERA5 IC, SST/SIC, solar/ozone/GHG/aerosol/volcanic, topography, CLM
# surfdata) live in config/amip/amip_production.sh so this physics config stays
# machine-independent.
#
# 2026-07-07 — REBUILT to Pierre's reviewer directives (the reference from now):
#   1. GRID: lat-lon (reference dycore/grid), LOW RES (n_lat 24). Real ETOPO
#      topography + ERA5 IC (per directive; the coarse-latlon + real-topo + ERA5
#      combo is a known stability risk — see amip_latlon_column memory).
#   2. CLOUD: Sundqvist — flagged for CALIBRATION (very important for global
#      albedo; the numerical skill gate shows over-reflective/overcast).
#   3. GWD: McFarlane orographic (correct). NON-OROGRAPHIC (prognostic-spectral)
#      to be added as a combined oro+non-oro GWD path in a follow-up PR.
#   4. LAND: multilayer Richards + CLM PFT with the LMIP-CALIBRATED bake
#      (_TUNED_*_MULTILAYER in clm_surface_map.py, applied via use_multilayer_land
#      + --clm-surfdata-path). NOT Jarvis/Farquhar/Medlyn.
#   5. SURFACE: new STABLE-boundary-layer MOST (Beljaars-Holtslag 1991).
#   6. STOMATA: ON via the soil-moisture beta_soil path — which IS
#      land_stomatal_beta=false (that flag TRUE would select Jarvis/Farquhar,
#      the formulation directive 4 forbids). beta_soil = active, non-Jarvis
#      moisture-limited stomatal control.
# Tracking: GitHub issues #636, #832.
# =============================================================================

# --- Grid + dycore: lat-lon low-res (n_lat 24 ~7.5 deg) / L20, C-grid ----------
grid_type: latlon
discretization: latlon_cgrid
resolution: 24              # n_lat (lat-lon: resolution == number of latitudes)
nlev: 20
dt: 600.0                  # driver auto-clamps to the pole-cell CFL on lat-lon
# time_integrator: 'auto' (default) -> ssp_rk3 (non-scan) on lat-lon.  NOT
# ssp_rk3_scan: its lax.scan carry enforces dtype equality and the latlon-cgrid
# dycore emits a float64 p_s tendency against the float32 state (precision
# mismatch the non-scan integrator tolerates) -> scan carry-type TypeError.
# ssp_rk3_scan dtype bug on latlon+x64 = #835 — FIXED on main (0123e54fc/#838);
# ssp_rk3_scan is now usable, but keep 'auto' until the reference run is
# re-validated against the merged code.

# --- Atmospheric physics ------------------------------------------------------
radiation: rrtmg            # rrtmgp correlated-k (true CMIP6 RT)
rad_update_steps: 12
clouds: sundqvist
microphysics: morrison
convection: bechtold        # mass-flux (IFS lineage); dq_r precip wiring #832
turbulence: louis
gravity_wave_drag: mcfarlane  # orographic; combined + non-orographic (prognostic-spectral) = follow-up #834
diurnal_cycle: true
orbital_insolation: true

# --- Surface: tiled COARE3 ocean + land MOST, NEW STABLE-BL similarity ---------
surface_bulk_scheme: coare3
surface_stability_scheme: beljaars_holtslag1991  # Pierre #5: new stable-BL MOST
surface_gustiness_zi: 300.0
surface_tiled: true
surface_z0_land: 0.1

# --- Land: multilayer Richards + LMIP-calibrated bake; stomata ON = beta_soil --
use_multilayer_land: true
multilayer_n_layers: 10
multilayer_soil_depth: 3.0
land_soil_moisture_init_frac: 0.25
land_surface_scheme: simple_seb   # bulk SEB + beta_soil moisture-stress conductance
# STOMATA ON (non-Jarvis): the beta_soil root-zone moisture stress IS the active,
# non-Jarvis/Farquhar/Medlyn stomatal control.  land_stomatal_beta=TRUE would
# instead enable Jarvis/Farquhar (Pierre #4: do NOT), so it stays false.
land_stomatal_beta: false
snow_albedo_feedback: true

# --- Cloud tuning (CALIBRATION TARGET — Pierre #2, critical for global albedo) -
# The numerical skill gate (scripts/validate/amip_skill_score.py) shows the cloud
# field is over-reflective / overcast (rsut, clt, netTOA fail).  Calibrate against
# CERES-EBAF albedo after the first lat-lon run; levers: convective_cloud,
# conv_cloud_max, cloud_q_c_diagnostic (LWP), rh_crit, alpha_xr.
cloud_q_c_diagnostic: 3.0e-4
convective_cloud: true      # CALIBRATE: on pushes planetary albedo up under
                            # prescribed SST — revisit for CERES albedo match

# --- Forcing selectors (observed SST/SIC + full CMIP6 external forcing) --------
# Real ETOPO topography + ERA5 IC come from the machine PATH flags
# (amip_production.sh: --topography ${ETOPO}, --ic-path ${ERA5_IC}).
ic: era5
dataset: custom
sst_var: tosbcs
sst_offset: 0.0
sic_var: siconcbcs
sic_scale: 0.01
solar_source: file
solar_tsi_var: TSI
ozone_forcing: external
ghg_forcing: external
aerosol_forcing: external
start_year: 1979

# --- Diagnostics / output (CMIP6-protocol CMOR) -------------------------------
diag_days: 5
checkpoint_days: 30
monthly_means: true
cmip_output: true
clear_sky_diag: true
