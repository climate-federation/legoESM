inputs:
  nmc_sample: outputs/mpas_nmc_r6_l40/samples/mpas_nmc_case_009_20170115000000.npz
  gen_be_path: outputs/mpas_gen_be_r6_l40/mpas_gen_be

output:
  directory: outputs/mpas_single_point_t500_4dvar

model:
  resolution: 6
  levels: 40
  time_step_seconds: 60.0
  hyperdiffusion_scale: 0.5
  horizontal_diffusion_scale: 0.0
  vertical_temperature_diffusion: 2.0e-6
  lloyd_iterations: 0

background:
  sample_state: f24
  verification_time: 2017-01-15T00:00:00
  era5_initialization_time: 2017-01-14T00:00:00

observation:
  variable: T500
  latitude_degrees_north: 45.0
  longitude_degrees_east: 310.0
  increment_k: 2.0
  error_standard_deviation_k: 1.0
  four_dvar_time_hours: 6.0
  three_dvar_time_hours: 0.0

background_error:
  horizontal_length_scale_multiplier: 1.0
  standard_deviation_multiplier: 3.0
  diffusion_iterations: 400

optimization:
  maximum_iterations: 4
  gradient_tolerance: 1.0e-5
  function_tolerance: 1.0e-10
  history_size: 3

diagnostics:
  forecast_hours: [0.0, 2.0, 4.0, 6.0]

plot:
  longitude_extent_degrees: [-100.0, 0.0]
  latitude_extent_degrees: [20.0, 70.0]
  temperature_increment_limits_k: [-0.7, 0.7]
  temperature_increment_interval_k: 0.1
  geopotential_height_interval_m: 120.0
  dpi: 300
