era5:
  root: /glade/campaign/collections/rda/data/d633000

model:
  resolution: 6
  levels: 40
  vertical_coordinate: sigma
  time_step_seconds: 60.0
  hyperdiffusion_scale: 0.5
  horizontal_diffusion_scale: 0.0
  vertical_temperature_diffusion: 2.0e-6
  smoothing_passes: 4
  lloyd_iterations: 0

nmc:
  first_verification_time: 2017-01-07T00:00:00
  sample_count: 80
  interval_days: 1
  long_forecast_hours: 48
  short_forecast_hours: 24
  output_directory: outputs/mpas_nmc_r6_l40

gen_be:
  samples_glob: outputs/mpas_nmc_r6_l40/samples/mpas_nmc_case_*.npz
  output_path: outputs/mpas_gen_be_r6_l40/mpas_gen_be
  vertical_correlation_length: 2.0
  default_horizontal_length_scale_km: 500.0
  temperature_balance_scale: 1.0
  surface_pressure_balance_scale: 0.0
  minimum_eigenvalue_fraction: 1.0e-4
