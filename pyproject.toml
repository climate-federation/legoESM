[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "legoesm"
version = "0.1.0"
description = "legoESM: A Differentiable Earth System Model in JAX"
readme = "README.md"
license = "LicenseRef-PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    {name = "Pierre Gentine"},
]
keywords = ["earth-system-model", "jax", "differentiable", "weather", "climate"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = [
    # The substrate, carved into its own installable member (uv workspace).
    # Everything still imports as ``legoesm.<subpkg>`` via the shared PEP-420
    # namespace; this is what lets ``legoesm-atmosphere`` / ``-ocean`` / ... be
    # shipped independently on top of the same core (see FEDERATION.md).  Pinned
    # to the matching minor (single-sourced version; members bump in lock-step)
    # so a non-workspace ``pip install legoesm`` cannot resolve a mismatched core.
    "legoesm-core~=0.1.0",
    # The four Earth-system components, each its own installable member on top of
    # legoesm-core (mutually independent — import-linter contract #2).  The meta
    # ``legoesm`` pulls them all; ``pip install legoesm-ocean`` alone is enough to
    # run the ocean standalone.
    "legoesm-atmosphere~=0.1.0",
    "legoesm-ocean~=0.1.0",
    "legoesm-land~=0.1.0",
    "legoesm-ice~=0.1.0",
    # The orchestration cluster (coupler/driver, ml/training/da, tools): the meta
    # package's own modules (cli, config, dycore_factory, taxonomy) import these,
    # so the meta-member pulls the whole stack.  They are mutually interdependent
    # (a uv-workspace cycle), unlike the four independent components above.
    "legoesm-coupler~=0.1.0",
    "legoesm-ml~=0.1.0",
    "legoesm-tools~=0.1.0",
    "jax>=0.4.35",              # install minimum; tested with 0.8–0.9
    "jaxlib>=0.4.35",           # must match jax
    "equinox>=0.11",
    "optax>=0.2",
    "xarray>=2024.0",
    "zarr>=2.18",
    "matplotlib>=3.9",
    "cartopy>=0.23",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "netCDF4>=1.6",
    "dataclasses-json>=0.6",
    "scipy>=1.10",
    "pandas>=2.0",
]

[project.optional-dependencies]
# clm-ml-jax is published on PyPI (https://pypi.org/project/clm-ml-jax/).
# The 0.1.0 release ships the DIFFERENTIABLE canopy capability: its
# `_CanopyFluxesDiagnostics` accepts `grid=`, so the canopy-integrated flux
# diagnostics run on the jax.grad tape (CLMMLCanopyConfig(differentiable=True)).
# `clm_ml_interface` still PROBES this capability at runtime and raises a clear,
# actionable error if an older/local build lacks it (so there is never a silent
# wrong answer); forward-only mode (the default) needs only the base 0.1.0.
# Editable local checkouts (`pip install -e ./clm-ml-jax`) still shadow the
# published wheel for development.
canopy = ["clm-ml-jax>=0.1.0"]
# gcsfs/fsspec included: the ML training lane's DEFAULT ERA5 path is a gs://
# zarr store (load_era5_samples / era5_to_state), so the ml extra must open it
# without also requesting [data] (#817 papercut: the WB runbook env built
# --extras dev only and hit ModuleNotFoundError: gcsfs at first data load).
ml = ["imageio>=2.30", "equinox>=0.11", "optax>=0.2",
      "gcsfs>=2024.2", "fsspec>=2024.2"]
mesh = ["pymetis>=1.2", "scipy>=1.10"]
viz = ["matplotlib>=3.9", "cartopy>=0.23"]
data = [
    "gcsfs>=2024.2",
    "fsspec>=2024.2",
]
# Apple-Silicon local-GPU backend via MLX (PJRT plugin). Select with
# ``JAX_PLATFORMS=mps``.
# float32 ONLY — MLX has no float64, so ``JAX_ENABLE_X64=1`` arrays raise and
# complex128 downcasts to complex64; spectral/x64/conservation-grade and any
# mpi4jax-collective run must stay on ``JAX_PLATFORMS=cpu``. Single MpsDevice:
# no SPMD/MPI multi-device. Good for single-device float32 FV dycore / ML work.
mps = ["jax-mps"]
# Interactive configuration wizard (scripts/experiment/wizard.py, `legoesm wizard`).
wizard = ["questionary>=2.0"]
# Tested jax envelope for MPI is >=0.8,<0.10 (runtime-guarded in
# parallel/reductions.py).  jax 0.10 removed the legacy CustomCallV1 that
# mpi4jax 0.8.x used; mpi4jax 0.9.0 (the FFI rewrite, mpi4jax#289) switched to
# JAX's FFI mechanism and works on jax 0.10+ — so pip resolves the FFI 0.9.x by
# default here.  Do NOT cap jax here: uv resolves one universal lock across all
# extras, so a cap would downgrade the default (non-MPI) workspace install.
# For a working MPI stack install `-r requirements_mpi.txt` (pinned combo).
mpi = [
    "mpi4py>=4.1,<5",
    "mpi4jax>=0.8,<0.10",
]
dev = [
    "pytest>=8.0",
    "pytest-xdist",
    "pytest-timeout",
    "ruff",
    "mypy",
    "pre-commit",
    "import-linter>=2.0",
    # Federation packaging validation (scripts/validate_federation_packaging.py):
    # build the per-member wheels + root-absent install in CI.
    "build>=1.0",
    "hatchling",
]
docs = ["sphinx", "myst-parser", "furo"]
all = [
    "legoesm[ml,mesh,viz,data,dev,docs,wizard]",
]

[project.scripts]
legoesm = "legoesm.cli:main"

# NOTE: the "legoesm.sw_barotropics" entry points (the FV3 shallow-water dycore
# providers the ocean barotropic solver resolves by name) are declared by their
# PROVIDER, legoesm-atmosphere, NOT here — so `pip install legoesm-ocean
# legoesm-atmosphere` registers them without the root meta-package.  See
# packages/atmosphere/pyproject.toml.

[tool.hatch.build.targets.wheel]
packages = ["src/legoesm"]

# === uv workspace (federation carve) ===
# The repo is a uv workspace; the substrate lives in its own member
# (packages/core, dist name legoesm-core) and the root ``legoesm`` is the
# meta-member that depends on it.  Each member's folder drops the legoesm- prefix
# and has no src/ level (packages/<m>/legoesm/<subpkg>); the root depends on them
# via [tool.uv.sources].  All members ship into the
# one ``legoesm`` PEP-420 namespace, so imports are unchanged.
[tool.uv.workspace]
members = ["packages/*"]

# Every inter-member dependency resolves to the in-tree workspace member (never
# PyPI).  All members must be listed here, or uv would try to fetch e.g.
# legoesm-atmosphere~=0.1.0 from an index that does not publish it yet.
[tool.uv.sources]
legoesm-core = { workspace = true }
legoesm-atmosphere = { workspace = true }
legoesm-ocean = { workspace = true }
legoesm-land = { workspace = true }
legoesm-ice = { workspace = true }
legoesm-coupler = { workspace = true }
legoesm-ml = { workspace = true }
legoesm-tools = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
# FV3-native dycore ports (docs/.../fv3_native campaign): these modules are
# loop-faithful, INDEX-EXACT transcriptions of GFDL_atmos_cubed_sphere Fortran
# (sw_core/tp_core/a2b_edge/fv_grid_*).  The Fortran-metric locals are held in
# UPPER_SNAKE fort views (DXA, DEL6_V, SIN_SG, CSG, ...) to mirror the source
# 1:1 — renaming to snake_case would destroy the line-by-line cross-reference
# to the oracle (the higher-priority faithfulness goal).  `fort`/`fort1` are
# deliberately lower-case (they read as array *views*, not classes).  N803/N806
# = kernel args/vars, N801 = the fort view classes.
"packages/core/legoesm/core/fv3_native_sw_core.py" = ["N803", "N806", "N801"]
"packages/core/legoesm/core/fv3_native_d_sw.py" = ["N803", "N806", "N801"]
"packages/core/legoesm/core/fv3_native_duo_sw_core.py" = ["N803", "N806", "N801"]
"packages/core/legoesm/grids/fv3_native_gridstruct.py" = ["N801", "N803", "N806"]
# FV3-native oracle validators/tests: same verbatim-Fortran UPPER_SNAKE
# metric locals (SIN/COS/DXC/RC, ...) mirroring the source 1:1.
"scripts/validate/fv3_native/gen_divduo_oracle.py" = ["N806", "N816"]
"tests/grids/test_fv3_native_duo_phase4c.py" = ["N806"]
# Fuller CLUBB port (PORT_CLUBB.md): the closure coefficients, model flags and
# intermediate variables mirror CLUBB's canonical symbol names 1:1 (c_K1,
# iiPDF_type, l_use_C7_Richardson, C2rt, Skw, wpthlp, Lscale, ...) as in
# CLUBB-JAX, parameters_tunable.F90, and the CAM ``clubb_*`` namelist. Renaming
# them to snake_case would destroy the cross-reference to the reference and the
# tuning literature (the higher-priority correctness/faithfulness goal), so the
# pep8-naming mixedCase rules are relaxed ONLY for these files.
# Glob over all CLUBB turbulence modules (clubb.py, clubb_grid.py,
# clubb_config.py, clubb_helpers.py, clubb_pdf.py, clubb_mixing_length.py,
# clubb_moments.py, clubb_saturation.py, ...). Excludes the pre-existing
# clubb_lite.py (already clean) only incidentally — relaxing naming there is
# harmless. N815 covers the config symbol fields; N803/N806 the kernel args/vars.
"packages/atmosphere/legoesm/atmosphere/physics/turbulence/clubb*.py" = ["N802", "N803", "N806", "N815"]
# Column-LES diagnosis/pipeline: physical symbol names (C_K, K_m, Pr_t, N_sq,
# cape_J_kg) + CLAUDE.md-mandated unit suffixes (_K for Kelvin) read clearer than
# snake_case; same rationale as the clubb modules.
"packages/atmosphere/legoesm/atmosphere/dynamics/column_les_diagnosis.py" = ["N803", "N806", "N815"]
"packages/atmosphere/legoesm/atmosphere/dynamics/column_les.py" = ["N803", "N806", "N815"]
# LES-suite case registry (docs/atmosphere/les_suite): case-definition dataclass
# fields and generator args carry CLAUDE.md-mandated unit suffixes on kinematic
# fluxes (surface_theta_flux_K_m_s [K m/s], fluxes_K_m_s) whose Kelvin "K" reads as
# mixedCase to pep8-naming. The unit suffix is load-bearing (units-in-names rule);
# same rationale as the clubb / column-LES modules. N815 = dataclass field, N803 = arg.
"packages/atmosphere/legoesm/atmosphere/les_suite/registry.py" = ["N815"]
"packages/atmosphere/legoesm/atmosphere/les_suite/catalog.py" = ["N803"]
# CBL intercomparison gate: physical symbol Q0 (surface heat flux) as an arg, and
# the mK/m unit suffix on the well-mixed metric field read clearer than snake_case
# (units-in-names rule); same rationale as the clubb / column-LES modules.
"packages/atmosphere/legoesm/atmosphere/les_suite/intercomparison.py" = ["N803", "N815"]
"tests/atmosphere/les_suite/test_intercomparison.py" = ["N802", "N803", "N806"]
# Column large-scale extractor: physical symbol names (T, T_v for temperature /
# virtual temperature) read clearer than snake_case; same rationale. Test files
# use the same symbols (T) + set jax_enable_x64 before importing (E402).
"packages/atmosphere/legoesm/atmosphere/dynamics/column_large_scale_extract.py" = ["N803", "N806"]
"tests/atmosphere/test_column_large_scale_extract*.py" = ["E402", "N806"]
# Compare-to-reanalysis bridge + its tests: physical symbol names (T for
# temperature, T_v for virtual temperature) + CLAUDE.md-mandated unit suffixes
# (sst_K) read clearer than snake_case. N815 covers the ColumnState.sst_K field.
"packages/ml/legoesm/training/compare_reanalysis.py" = ["N803", "N806", "N815"]
"tests/unit/test_compare_reanalysis.py" = ["N803", "N806"]
# compare-reanalysis e2e: the SST-in-Kelvin local var sst_K carries the model's _K unit
# suffix (CLAUDE.md naming) — the same convention as compare_reanalysis.py above.
"tests/run/test_correction_e2e_integration.py" = ["N806"]
# bias_metrics: PerVariableBias unit-suffixed global-scalar fields (global_T_rmse_K,
# global_qv_rmse_kg_kg, ...) — CLAUDE.md-mandated unit suffixes read clearer than
# snake_case and are kept DISTINCT from the per-column ColumnErrorFields names.
"packages/ml/legoesm/training/bias_metrics.py" = ["N815"]
# LES-closure diagnosis tests: physical symbol names (Km, Kh, S2, N2, P, C_K,
# Pr_t) match the clubb_lite budget + diagnosis kernels they exercise.
"tests/unit/test_les_closure_diagnosis.py" = ["N803", "N806"]
# Prognostic-aerosol faithfulness: budget symbols (N number, S source, L sink
# rate, P precip) match the pinned dN/dt = S - L*N budget.
"tests/unit/test_prognostic_aerosol_faithful.py" = ["N803", "N806"]
# Ice-shelf three-equation faithfulness: T/S ambient temperature/salinity and
# A/B/C quadratic coefficients match the Holland-Jenkins governing equations.
"tests/ocean/unit/test_ice_shelf_three_equation_faithful.py" = ["N803", "N806"]
# CATKE faithfulness: physics symbols N2/S2/Ri/K_u/K_c/K_e/Jb/H match the
# Wagner-2025 CATKE closure notation.
"tests/ocean/unit/test_catke_faithful.py" = ["N803", "N806"]
# Backscatter reservoir faithfulness: E is the subgrid-KE reservoir symbol
# (Jansen-Held 2014).
"tests/ocean/unit/test_backscatter_reservoir_faithful.py" = ["N803", "N806"]
# Enhanced-diffusion faithfulness: K (diffusivity) / A (viscosity) convective-
# adjustment symbols (Oceananigans ConvectiveAdjustment).
"tests/ocean/unit/test_enhanced_diffusion_faithful.py" = ["N806"]
# Plume convection faithfulness: T/S ocean temperature/salinity + Tp/Sp plume
# parcel symbols (entraining mass-flux plume).
"tests/ocean/unit/test_plume_convection_faithful.py" = ["N803", "N806"]
# PBL-height faithfulness: T/Q/U/V atmospheric column symbols + dV2 shear-square
# (bulk-Richardson PBL diagnosis).
"tests/atmosphere/hydrostatic/unit/test_pbl_height_faithful.py" = ["N803", "N806"]
"scripts/validate/compare_amip_era5.py" = ["N803", "N806", "N815"]
# The canonical SST symbol is ``sst_K`` (used 100s of times); N806/N803 flag the local
# variable / monkeypatch arg in the cross-grid deploy CLI + its test (not CI-enforced).
"scripts/experiment/check_cross_grid_deploy.py" = ["N806"]
# Semi-implicit gravity-wave stability gate (#920): physical symbol names --
# ``T`` for temperature (argument + local) and ``Gamma`` for the
# Hoskins-Simmons vertical-coupling matrix (matching semi_implicit.py) read
# clearer than snake_case. Same rationale as the column-extractor tests above.
"tests/atmosphere/hydrostatic/unit/test_semi_implicit_gw_stability.py" = ["N803", "N806"]
"tests/unit/test_check_cross_grid_deploy.py" = ["N803"]
# NEMO Roquet EOS-80 test: physical symbols ``T``/``S`` as args + locals, and
# ``jax_enable_x64`` set before the module import (E402) -- same rationale as the
# scientific-kernel test entries above.
"tests/ocean/unit/test_nemo_roquet_eos.py" = ["E402", "N803", "N806"]
# Run-as-a-script sys.path bootstrap (iter 321) must precede the ``scripts.*`` import, so the
# subsequent module-level imports trip E402; the bootstrap makes ``python scripts/...`` work.
"scripts/validate/run_perfect_model_osse.py" = ["E402"]
# ERA5->model regridders + their tests: physical symbol names (T, u, v, q) +
# field-name vars (T_cell, T_model) read clearer than snake_case; E402 covers the
# x64-before-import idiom / logging setup.
"packages/ml/legoesm/training/era5_to_state.py" = ["E402", "N803", "N806", "N815"]
"tests/unit/test_era5_mpas_carry.py" = ["N806"]
# CLUBB port tests use the same physical symbol names as the modules under test
# (T for temperature, Tc for deg C, etc.) — clearer than snake_case here. E402:
# these tests set jax_enable_x64 before importing the modules under test (a
# standard JAX-testing idiom), so module-level imports follow that call.
"tests/unit/test_clubb_*.py" = ["E402", "N802", "N803", "N806"]
# Same idiom: sets jax_enable_x64 before importing the module under test (real
# fp64 needed for the #618 fp32-vs-fp64 saturation comparison) and uses the
# physical symbol T for temperature.  I001: the config call sits between imports.
"tests/unit/test_warm_rain_fp32_saturation.py" = ["E402", "I001", "N803"]
# CLUBB validation/characterization scripts use the same physical symbol names
# (T for temperature) and set jax_enable_x64 before importing (E402).
"scripts/validate/clubb_*.py" = ["E402", "N802", "N803", "N806"]
# Cubed-sphere MPI face-scatter tests set jax_enable_x64 before importing the
# dycore (fp64 replicated-vs-scattered bit-equivalence), so imports follow.
"tests/parallel/test_cube_face_scatter.py" = ["E402"]
"tests/distributed/test_cube_face_scatter_mpi.py" = ["E402"]
# MPAS native-SPMD parity gates use the MPAS canonical symbol names (nCells,
# nEdges, W) plus the mandated T_sfc / dT unit-suffixed physics names; same
# rationale as the column-extractor tests above.
"tests/parallel/test_mpas_atm_native_step.py" = ["N806"]
# Coupled latlon-band slab step (C10): ``T`` for the atm temperature field
# (T = atm_state.T, N806) and the CLAUDE.md-mandated ``_K`` unit suffix on the
# freezing-floor config field (t_freeze_ocean_K, N815) read clearer than
# snake_case — same rationale as the physical-symbol entries above.
"packages/coupler/legoesm/coupler/coupled_latlon_band.py" = ["N806", "N815"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short -m 'not slow'"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    # Complexity-tier ladder (docs/validation/TESTING.md). Opt-in selectors: run a rung
    # with e.g. `-m 'tier1 and not slow'`. The default addopts stays `not slow`
    # (does NOT tier-gate) so untagged tests still run until the suite is tagged.
    "tier0: unit/operator tests — kernels, no model integration (numerical invariants)",
    "tier1: research tier — idealized/column/shallow-water; mass+energy+AAM gates, analytic benchmarks",
    "tier2: intermediate tier — hydrostatic 3D + slab; mass+energy+moisture gates (often slow)",
    "tier3: operational tier — full complexity + real forcing (AMIP/OMIP/ERA5); budget closure (slow)",
]

# ---------------------------------------------------------------------------
# Import-boundary enforcement (the path to independent self-running packages).
# These contracts encode the TARGET layered architecture (master plan D7):
#   core (substrate)  <  {atmosphere, ocean, land, ice}  <  coupler  <  driver
# Each Earth-system component must depend only on `core` (+ truly-shared bricks),
# never on another component or on the coupler/driver — that one-way dependency
# is exactly what lets `pip install legoesm-ocean` run standalone (Stage D carve).
#
# `ignore_imports` is the CURRENT-violation BASELINE: the contracts pass today,
# and every entry removed is a real step toward independence (a ratchet).  The
# goal is an empty ignore list = full component independence, enforced in CI.
# Run: `.venv/bin/lint-imports`
# ---------------------------------------------------------------------------
[tool.importlinter]
root_package = "legoesm"

# === ROOT INVERSION — the highest-priority independence fix ===
# A handful of low-level / shared modules import UP into atmosphere/ocean
# component dynamics; because `grids.halo_latlon -> parallel.latlon_mpi`, that
# single inversion cascades into nearly every cross-component and core→component
# chain.  Fixing these collapses most of the graph:
#   parallel.latlon_mpi  -> atmosphere.dynamics.primitive_eq_latlon_cgrid, ocean.state
#   ml.channel_packing   -> atmosphere.dynamics.{spectral_pe,spectral_sw}, ocean.state
# (a parallel/ML helper should receive grids/state as ARGS, not import components).
# The remaining direct fixes: move the shared C-grid operators
# (ocean.dynamics.latlon_cgrid_operators) and surface-flux/coupling bricks
# (coupler.{bulk_flux,surface_energy,coupling_fields}) into `core`.

[[tool.importlinter.contracts]]
name = "core is the shared substrate (imports nothing above it)"
type = "forbidden"
source_modules = ["legoesm.core"]
forbidden_modules = [
    "legoesm.atmosphere",
    "legoesm.ocean",
    "legoesm.land",
    "legoesm.ice",
    "legoesm.coupler",
    "legoesm.driver",
    "legoesm.runtime",
    "legoesm.training",
]
# EXACT current-violation baseline (no wildcards): alerting="error" means a
# stale entry (coupling removed) or a missed one (coupling added) BOTH fail, so
# the list can only shrink — a true ratchet toward zero.
unmatched_ignore_imports_alerting = "error"
ignore_imports = [
    # core->runtime: intentional FUNCTION-SCOPE deferred imports (CLAUDE.md) to
    # avoid the runtime/__init__ <-> core init cycle — not a real layering break.
    "legoesm.core -> legoesm.runtime.backend",
    "legoesm.core.conservation -> legoesm.runtime.backend",
    "legoesm.core.hardware -> legoesm.runtime.backend",
    "legoesm.core.hardware -> legoesm.runtime.config",
    "legoesm.core.precision -> legoesm.runtime.backend",
    # core->ocean/atmosphere is only via core->grids.halo_latlon->parallel->
    # component (the root inversion above); baseline the core->grids hop.
    "legoesm.core.operators_latlon -> legoesm.grids.halo_latlon",
    "legoesm.core.operators_latlon_3d -> legoesm.grids.halo_latlon",
    "legoesm.core.operators_fv_latlon -> legoesm.grids.halo_latlon",
    "legoesm.core.operators_fv_latlon_3d -> legoesm.grids.halo_latlon",
]

[[tool.importlinter.contracts]]
name = "Earth-system components are independent of each other"
type = "independence"
modules = [
    "legoesm.atmosphere",
    "legoesm.ocean",
    "legoesm.land",
    "legoesm.ice",
]
unmatched_ignore_imports_alerting = "error"
# ZERO-IGNORE: the atmosphere/ocean/land/ice components are now genuinely
# independent of one another.  The shared dycore functions are shared through
# the SUBSTRATE, not component->component imports:
#   * lat-lon C-grid differential operators -> legoesm.grids.operators_latlon_cgrid
#     (Group A: both the atm cgrid dycores and the ocean import them from grids);
#   * the FV3 shallow-water STATE pytrees -> legoesm.core.shallow_water_state
#     (Group B pt1: shared by the atm SW dycore and the ocean barotropic solver);
#   * the FV3 shallow-water DYCORE itself is shared via the foundational
#     legoesm.registry.SW_BAROTROPIC_REGISTRY — the atmosphere registers its
#     "fv3sw"/"fv3edge" builders on import and the ocean barotropic RESOLVES one
#     by name (Group B pt2), so neither component imports the other;
#   * parallel.latlon_mpi re-instantiates the MPI dycore via type(model) from the
#     passed-in instance (Group C), not an atmosphere import.
ignore_imports = []

[[tool.importlinter.contracts]]
# A standalone component package may use the shared SUBSTRATE that legoesm-core
# bundles (core, runtime, parallel, grids, io, timestepping) — but never the
# orchestration layers ABOVE it: coupler, driver, ml/training/da, or the tools
# (forcing, diagnostics, experiments, visualization).  That one-way dependency is
# what makes `pip install legoesm-ocean` (base, core-only) run standalone.
#
# The ONLY allowed component->above edges are the OPTIONAL heavy features whose
# install path is declared as a per-component extra (legoesm-atmosphere[ml],
# legoesm-ocean[ml], legoesm-ocean[tools]) — the SFNO/U-Cast neural dycores / ML
# physics parameterization (-> legoesm.ml.*) and the Stommel-gyre drift diagnostic
# (-> legoesm.diagnostics).  Those exact edges are baselined below; the BASE
# component import is still core-only (`import legoesm.atmosphere`/`legoesm.ocean`
# pulls no ml/tools — verified).  alerting="error" makes this a ratchet: any NEW
# component->above edge that is not one of these declared-optional ones fails.
name = "Components must not import the orchestration layers above them"
type = "forbidden"
source_modules = [
    "legoesm.atmosphere",
    "legoesm.ocean",
    "legoesm.land",
    "legoesm.ice",
    "legoesm.components",
]
forbidden_modules = [
    "legoesm.coupler",
    "legoesm.driver",
    "legoesm.training",
    "legoesm.ml",
    "legoesm.da",
    "legoesm.forcing",
    "legoesm.diagnostics",
    "legoesm.experiments",
    "legoesm.visualization",
]
unmatched_ignore_imports_alerting = "error"
ignore_imports = [
    # OPTIONAL FEATURE: SFNO/U-Cast neural dynamical cores + ML physics
    # parameterization. Declared by the legoesm-atmosphere[ml] / legoesm-ocean[ml]
    # extras (top-level imports; the base component does not pull these modules —
    # both sfno_pe and ucast_pe are lazily re-exported by dynamics/__init__).
    "legoesm.atmosphere.dynamics.sfno_sw -> legoesm.ml.sfno",
    "legoesm.atmosphere.dynamics.sfno_sw -> legoesm.ml.normalization",
    "legoesm.atmosphere.dynamics.sfno_sw -> legoesm.ml.channel_packing",
    "legoesm.atmosphere.dynamics.sfno_pe -> legoesm.ml.sfno",
    "legoesm.atmosphere.dynamics.sfno_pe -> legoesm.ml.normalization",
    "legoesm.atmosphere.dynamics.sfno_pe -> legoesm.ml.channel_packing",
    "legoesm.atmosphere.dynamics.sfno_pe -> legoesm.ml.conservation",
    "legoesm.atmosphere.dynamics.ucast_pe -> legoesm.ml.ucast",
    "legoesm.atmosphere.dynamics.ucast_pe -> legoesm.ml.normalization",
    "legoesm.atmosphere.dynamics.ucast_pe -> legoesm.ml.channel_packing",
    "legoesm.atmosphere.dynamics.ucast_pe -> legoesm.ml.conservation",
    "legoesm.atmosphere.physics.ml_parameterization -> legoesm.ml.normalization",
    "legoesm.atmosphere.physics.ml_parameterization -> legoesm.ml.physics.io",
    "legoesm.atmosphere.physics.ml_parameterization -> legoesm.ml.physics.model",
    "legoesm.ocean.dynamics.sfno_ocean -> legoesm.ml.sfno",
    "legoesm.ocean.dynamics.sfno_ocean -> legoesm.ml.normalization",
    "legoesm.ocean.dynamics.sfno_ocean -> legoesm.ml.conservation",
    # OPTIONAL FEATURE: ocean Stommel-gyre tracer experiment drift diagnostic.
    # Declared by the legoesm-ocean[tools] extra (deferred/function-scope import).
    "legoesm.ocean.experiments.stommel_gyre_tracer -> legoesm.diagnostics",
]

[[tool.importlinter.contracts]]
# The legoesm-core MEMBER (the uv-workspace substrate: FEDERATION.md) is more
# than the `core` subpackage — it also bundles grids/runtime/parallel/io/
# timestepping/components.  Contract #1 only guards `core`, so UP-imports from
# those sibling substrate packages into the Earth-system / orchestration layer
# slipped through and would make `pip install legoesm-core` pull atmosphere /
# forcing / driver (a dependency cycle).  This contract guards the WHOLE member
# so the carve stays a mechanical file move, not a dependency inversion.
name = "legoesm-core member imports nothing above it"
type = "forbidden"
source_modules = [
    "legoesm.core",
    "legoesm.grids",
    "legoesm.runtime",
    "legoesm.parallel",
    "legoesm.io",
    "legoesm.timestepping",
    "legoesm.components",
    # The core member also ships these top-level substrate modules (they have no
    # __init__-package home); guard them too so the WHOLE member — not just its
    # subpackages — provably imports nothing above core.  surface_albedo lives
    # here (not the root meta) because land/ice/coupler import it at top level,
    # so `pip install legoesm-land` must get it from the substrate.
    "legoesm.constants",
    "legoesm.thermo",
    "legoesm.registry",
    "legoesm.surface_albedo",
]
forbidden_modules = [
    "legoesm.atmosphere",
    "legoesm.ocean",
    "legoesm.land",
    "legoesm.ice",
    "legoesm.coupler",
    "legoesm.driver",
    "legoesm.training",
    "legoesm.ml",
    "legoesm.da",
    "legoesm.forcing",
    "legoesm.diagnostics",
    "legoesm.experiments",
    "legoesm.visualization",
]
unmatched_ignore_imports_alerting = "error"
# RATCHET baseline — the exact current UP-import edges (top-level + grimp-visible
# deferred/function-scope).  alerting="error" means a stale entry (edge removed)
# OR a new one BOTH fail, so this list can only shrink toward zero.  Each fix
# (voronoi_mpi type(model); io re-scope) deletes its lines here.
ignore_imports = [
    # core->runtime: the same intentional function-scope deferred imports already
    # baselined in contract #1 (runtime/__init__ <-> core init cycle).
    "legoesm.core -> legoesm.runtime.backend",
    "legoesm.core.conservation -> legoesm.runtime.backend",
    "legoesm.core.hardware -> legoesm.runtime.backend",
    "legoesm.core.hardware -> legoesm.runtime.config",
    "legoesm.core.precision -> legoesm.runtime.backend",
    # parallel.voronoi_mpi: FIXED — re-instantiates the dynamics model via
    # type(model)(local_mesh, ...) and calls .tendencies (no atmosphere import).
    # parallel.sharded_dynamics: FIXED — the shard_map tendency call now reads the
    # free RHS off the passed-in model instance (model.sharded_tendency_fn, a
    # staticmethod), so it runs on the rank-local TRACED mesh without importing
    # the atmosphere component.  legoesm-core is now standalone-installable AND
    # standalone-runnable (no upward atmosphere edge remains, top-level or deferred).
    # io config-aware checkpoint/restart: FIXED via re-scope (Step 3) — the
    # experiment-aware modules moved to driver.{restart,checkpoint,
    # distributed_checkpoint}; io keeps only pure-array I/O (cmor_output,
    # state_checkpoint) + the pure state-digest (io.state_digest), and the
    # config codec now lives canonically in driver.config.  io imports nothing
    # above it.
]
