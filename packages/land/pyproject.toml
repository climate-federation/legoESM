[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "legoesm-land"
version = "1.0.0"
description = "legoESM land component: multilayer soil thermal/hydrology, snow budget, stomatal conductance, carbon cycle, slab + lake surfaces."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Pierre Gentine" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
# Depends ONLY on the substrate (legoesm-core) — NOT on the other Earth-system
# components, NOR on the coupler/driver/training above it.  Both invariants are
# machine-enforced by the import-linter contracts ("Earth-system components are
# independent of each other" + "Components must not import the coupler, driver,
# or training"), which is what lets `pip install legoesm-land` run standalone.
dependencies = [
    "legoesm-core~=1.0.0",
    "jax>=0.5.3",
    "jaxlib>=0.5.3",
    "numpy>=1.26",
    "equinox>=0.11",
    # NetCDF surface-data + EC-site driver IO (global_surface_data, boundary_data).
    "xarray>=2024.1",
    "netCDF4>=1.6",
]

[tool.uv.sources]
legoesm-core = { workspace = true }

# PEP-420 namespace package: no legoesm/__init__.py; this wheel ships only
# legoesm/land into the shared `legoesm` namespace, so it imports as legoesm.land.
[tool.hatch.build.targets.wheel]
packages = ["legoesm"]
# Ship the vendored CLM-ML-JAX RSL psihat look-up table (importlib.resources reads
# it at runtime) in the built wheel — .py-only packaging would drop the .nc.
artifacts = ["legoesm/land/canopy/clm_ml_backend/multilayer_canopy/data/*.nc"]
