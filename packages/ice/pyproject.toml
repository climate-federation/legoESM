[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "legoesm-ice"
version = "1.0.0"
description = "legoESM sea-ice (cryosphere) component: thermodynamic + dynamic sea-ice."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Pierre Gentine" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
# Depends ONLY on the substrate (legoesm-core) — NOT on the other Earth-system
# components, NOR on the coupler/driver/training above it.  Both invariants are
# machine-enforced by the import-linter contracts ("Earth-system components are
# independent of each other" + "Components must not import the coupler, driver,
# or training"), which is what lets `pip install legoesm-ice` run standalone.
dependencies = [
    "legoesm-core~=1.0.0",
    "jax>=0.5.3",
    "jaxlib>=0.5.3",
    "numpy>=1.26",
    "equinox>=0.11",
]

[tool.uv.sources]
legoesm-core = { workspace = true }

# PEP-420 namespace package: no legoesm/__init__.py; this wheel ships only
# legoesm/ice into the shared `legoesm` namespace, so it imports as legoesm.ice.
[tool.hatch.build.targets.wheel]
packages = ["legoesm"]
