[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "legoesm-wave"
version = "1.0.1"
description = "legoESM spectral ocean-wave component with WADEN dynamics and optional NeuralSWM parameterizations."
readme = "README.md"
license = { text = "MIT" }
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Pierre Gentine" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
# Depends ONLY on the substrate.  The wave model exchanges fields with the
# atmosphere and ocean through the coupler; it never imports either component.
dependencies = [
    "legoesm-core~=1.0.0",
    "jax>=0.5.3",
    "jaxlib>=0.5.3",
    "numpy>=1.26",
    "equinox>=0.11",
]

[tool.uv.sources]
legoesm-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["legoesm"]
