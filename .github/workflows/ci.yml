name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install-smoke:
    name: Install & Import Smoke
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Import smoke test
        run: |
          python -c "import legoesm; print(f'legoESM {legoesm.__version__}')"
          python -c "from legoesm.config import Config"
          python -c "from legoesm.core.hardware import detect_devices"
          python -c "from legoesm.driver.config import ExperimentConfig"
          python -c "from legoesm.io.restart import save_restart, load_restart"
          python -c "import legoesm.coupler"
          python -c "import legoesm.ocean"
          python -c "import legoesm.ml"
          python -c "import legoesm.da"
          echo "All imports successful"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - name: Ruff check (errors only)
        run: ruff check src/legoesm --select E9,F63,F7,F82 --statistics

  type-check:
    name: Type Check (core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: mypy on core modules
        run: |
          mypy src/legoesm/core/ src/legoesm/driver/ src/legoesm/io/ \
               src/legoesm/parallel/ --ignore-missing-imports || true

  test-collect:
    name: Test Collection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: Verify all tests collect
        run: python -m pytest --collect-only tests/ 2>&1

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [install-smoke, test-collect]
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - name: Run unit tests
        run: |
          python -m pytest tests/unit/ -x --timeout=300 \
            -k "not test_coupler_with_3d_ocean_fc_gram" \
            --tb=short -q
        timeout-minutes: 30

  top-level-fidelity-tests:
    # Iter-874 (Codex iter-873 stop-time fix): the iter chain's
    # Fortran-fidelity tests live at top-level `tests/test_*.py`
    # (not under `tests/unit/`).  The pre-iter-874 CI ran only
    # `tests/unit/` and `tests/atmosphere/`, so top-level tests
    # would not catch regressions despite passing locally.  This
    # job explicitly executes the top-level tests/test_*.py files
    # so the iter-862-873 chain regression sentinels actually run
    # on every push.
    #
    # Scope: only files matching `tests/test_*.py` at the top level
    # of `tests/` — not subdirectories.  Subdirectory tests
    # (`tests/atmosphere/`, `tests/distributed/`, etc.) have their
    # own CI jobs or are deliberately excluded for cost.
    name: Top-level Fortran-fidelity Tests
    runs-on: ubuntu-latest
    needs: [install-smoke, test-collect]
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - name: Run top-level tests/test_*.py
        env:
          JAX_ENABLE_X64: "1"
        # Use shell glob to restrict to top-level files only.
        # `bash -c` is required so the glob expands before pytest
        # sees the arguments; otherwise pytest gets the literal
        # `tests/test_*.py` and reports "no such file".
        run: |
          shopt -s nullglob
          files=( tests/test_*.py )
          if [ ${#files[@]} -eq 0 ]; then
            echo "ERROR: no top-level tests/test_*.py files matched"
            exit 1
          fi
          echo "Running ${#files[@]} top-level test files:"
          printf '  %s\n' "${files[@]}"
          python -m pytest "${files[@]}" -x --timeout=300 \
            --tb=short -q
        shell: bash
        timeout-minutes: 30

  restart-smoke:
    name: Restart Roundtrip
    runs-on: ubuntu-latest
    needs: [install-smoke]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: Restart roundtrip test
        run: |
          python -m pytest tests/unit/test_cmor_experiments_restart.py \
            tests/unit/test_zarr_checkpoint.py -v --tb=short
        timeout-minutes: 15

  integration-smoke:
    name: Integration Smoke
    runs-on: ubuntu-latest
    needs: [unit-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: Atmosphere integration smoke
        run: |
          python -m pytest tests/atmosphere/ -x --timeout=600 \
            -k "test_williamson or test_held_suarez" \
            --tb=short -q 2>&1 | head -50
        timeout-minutes: 30
