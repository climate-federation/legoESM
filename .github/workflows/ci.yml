name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly (03:17 UTC) — runs the non-blocking visual-regression diagnostic.
    - cron: "17 3 * * *"
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install-smoke:
    name: Install & Import Smoke
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Import smoke test
        run: |
          python -c "import legoesm; print(f'legoESM {legoesm.__version__}')"
          python -c "from legoesm.config import Config"
          python -c "from legoesm.core.hardware import detect_devices"
          python -c "from legoesm.driver.config import ExperimentConfig"
          python -c "from legoesm.io.restart import save_restart, load_restart"
          python -c "import legoesm.coupler"
          python -c "import legoesm.ocean"
          python -c "import legoesm.ml"
          python -c "import legoesm.da"
          echo "All imports successful"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # dev extra (not bare ruff): lint-imports/grimp must be able to import the
      # installed legoesm namespace to walk the dependency graph.
      - run: pip install -e ".[dev]"
      - name: Ruff check (errors only)
        run: ruff check src/legoesm --select E9,F63,F7,F82 --statistics
      - name: Import-boundary contracts (import-linter)
        run: lint-imports

  type-check:
    name: Type Check (core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: mypy on core modules
        run: |
          mypy src/legoesm/core/ src/legoesm/driver/ src/legoesm/io/ \
               src/legoesm/parallel/ --ignore-missing-imports || true

  test-collect:
    name: Test Collection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: Verify all tests collect
        run: python -m pytest --collect-only tests/ 2>&1

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [install-smoke, test-collect]
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      # Deliberately NO JAX_ENABLE_X64 here: the unit tier is fp32-by-default
      # (CLAUDE.md: "finite-volume can float32"); unit tests that need x64
      # self-enable it at module scope (e.g. test_spectral_plane_ops.py,
      # test_precision_modes.py). Setting it job-wide would change what the
      # fp32 paths test. x64 jobs: top-level-fidelity-tests, visual-regression.
      # Known wart: a module-level jax.config.update("jax_enable_x64", True)
      # leaks across the pytest session for subsequently-imported modules.
      - name: Run unit tests
        run: |
          python -m pytest tests/unit/ -x --timeout=300 \
            -k "not test_coupler_with_3d_ocean_fc_gram" \
            --tb=short -q
        timeout-minutes: 30

  top-level-fidelity-tests:
    # Iter-874 (Codex iter-873 stop-time fix): the iter chain's
    # Fortran-fidelity tests live at top-level `tests/test_*.py`
    # (not under `tests/unit/`).  The pre-iter-874 CI ran only
    # `tests/unit/` and `tests/atmosphere/`, so top-level tests
    # would not catch regressions despite passing locally.  This
    # job explicitly executes the top-level tests/test_*.py files
    # so the iter-862-873 chain regression sentinels actually run
    # on every push.
    #
    # Scope: only files matching `tests/test_*.py` at the top level
    # of `tests/` — not subdirectories.  Subdirectory tests
    # (`tests/atmosphere/`, `tests/distributed/`, etc.) have their
    # own CI jobs or are deliberately excluded for cost.
    name: Top-level Fortran-fidelity Tests
    runs-on: ubuntu-latest
    needs: [install-smoke, test-collect]
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - name: Run top-level tests/test_*.py
        env:
          JAX_ENABLE_X64: "1"
        # Use shell glob to restrict to top-level files only.
        # `bash -c` is required so the glob expands before pytest
        # sees the arguments; otherwise pytest gets the literal
        # `tests/test_*.py` and reports "no such file".
        run: |
          shopt -s nullglob
          files=( tests/test_*.py )
          if [ ${#files[@]} -eq 0 ]; then
            echo "ERROR: no top-level tests/test_*.py files matched"
            exit 1
          fi
          echo "Running ${#files[@]} top-level test files:"
          printf '  %s\n' "${files[@]}"
          python -m pytest "${files[@]}" -x --timeout=300 \
            --tb=short -q
        shell: bash
        timeout-minutes: 30
      - name: FV3-native grid fidelity tests (phase 1)
        # Source-derived FV3 gnomonic_ed oracle + static grid-provenance
        # gates. tests/grids/ has no other CI job; without this step the
        # phase-1 fidelity tests are collected but never executed.
        # iter62 (fixed create-layout centres) + iter73 (seam no-collapse)
        # protect the _GNOMONIC_ED_FACE_PERM/_ROT remap TOPOLOGY, which the
        # unordered point-cloud oracle test deliberately cannot see.
        env:
          JAX_ENABLE_X64: "1"
        run: |
          python -m pytest tests/grids/test_fv3_native_grid_phase1.py \
            tests/grids/test_fv3_native_metrics_phase2.py \
            tests/grids/test_gnomonic_ed_gate_iter68.py \
            tests/grids/test_gnomonic_ed_centers_iter62.py \
            tests/grids/test_gnomonic_ed_halo_nocollapse_iter73.py \
            -x --timeout=600 --tb=short -q
        timeout-minutes: 30

  restart-smoke:
    name: Restart Roundtrip
    runs-on: ubuntu-latest
    needs: [install-smoke]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: Restart roundtrip test
        run: |
          python -m pytest tests/unit/test_cmor_experiments_restart.py \
            tests/unit/test_zarr_checkpoint.py -v --tb=short
        timeout-minutes: 15

  integration-smoke:
    name: Integration Smoke
    runs-on: ubuntu-latest
    needs: [unit-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: Atmosphere integration smoke
        run: |
          python -m pytest tests/atmosphere/ -x --timeout=600 \
            -k "test_williamson or test_held_suarez" \
            --tb=short -q 2>&1 | head -50
        timeout-minutes: 30

  # Cube-artifact visual-regression diagnostic. NON-BLOCKING (continue-on-error)
  # and scheduled/manual only: the deterministic SSIM/perceptual-hash metrics are
  # already gated in CI by tests/test_visual_regression_metrics.py (in unit-tests),
  # but the full cube shallow-water --check tolerances still need calibration
  # across CI hardware / JAX versions before it can block a build. Promote to a
  # required job once it has demonstrated low false-fail on this runner.
  visual-regression:
    name: Visual Regression (cube imprint, nightly, non-blocking)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: W2 cube v-wind visual-regression check
        env:
          JAX_ENABLE_X64: "1"
          JAX_PLATFORMS: "cpu"
        run: |
          python scripts/validate/visual_regression.py --check 2>&1 | tail -20
        timeout-minutes: 20
