name: MPI Distributed

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  mpi-distributed:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OpenMPI
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openmpi-bin libopenmpi-dev
          mpirun --version

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,mpi]"

      - name: Run MPI Distributed Halo Tests (np=2,3,6)
        env:
          MPI4JAX_NO_WARN_JAX_VERSION: "1"
        run: |
          for n in 2 3 6; do
            echo "=== MPI distributed test, np=${n} ==="
            mpirun --oversubscribe -np "${n}" \
              python -m pytest -q tests/distributed/test_halo_mpi.py
          done
