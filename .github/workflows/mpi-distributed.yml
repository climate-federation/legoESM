name: MPI Distributed

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  mpi-distributed:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OpenMPI
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openmpi-bin libopenmpi-dev
          mpirun --version

      - name: Install Python Dependencies
        # Deterministic tested MPI stack (jax 0.9.2 + mpi4jax 0.8.1.post2) —
        # the envelope enforced by parallel/reductions.py
        # _validate_mpi_runtime_versions. A bare ".[dev,mpi]" install resolves
        # the latest jax (0.10+), which removed CustomCallV1 and breaks
        # mpi4jax 0.8/0.9 at runtime; this job previously passed only by
        # resolver luck. requirements_mpi.txt supplies pinned mpi4py/mpi4jax.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install -r requirements_mpi.txt

      - name: Run MPI Distributed Halo Tests (np=2,3,6)
        env:
          # mpi4jax 0.8's own version self-check predates jax 0.9 and warns
          # even inside legoESM's tested envelope; legoESM's runtime guard
          # (parallel/reductions.py, NOT suppressed) is the authoritative check.
          MPI4JAX_NO_WARN_JAX_VERSION: "1"
        run: |
          for n in 2 3 6; do
            echo "=== MPI distributed test, np=${n} ==="
            mpirun --oversubscribe -np "${n}" \
              python -m pytest -q tests/distributed/test_halo_mpi.py
          done

      - name: Run Plane Pencil MPI Tests (np=2,4)
        env:
          MPI4JAX_NO_WARN_JAX_VERSION: "1"
        run: |
          for n in 2 4; do
            echo "=== Plane pencil MPI test, np=${n} ==="
            mpirun --oversubscribe -np "${n}" \
              python -m pytest -q tests/distributed/test_plane_pencil_mpi.py
          done
