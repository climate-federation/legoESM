site_name: legoESM
site_description: A Differentiable Earth System Model in JAX
repo_url: https://github.com/gentine/legoESM
docs_dir: docs

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest

nav:
  - Home: index.md
  - Getting started: getting_started.md
  - Modelling:
      - Single-column model: scm.md
      - AMIP runs: amip.md
      - ML parameterization: ml_physics_parameterization.md
  - Validation:
      - Dycore catalogue: dycore_validation_catalog.md
      - Physics parameterization tests: PHYSICS_PARAMETERIZATION_TESTS.md
      - CMIP readiness: cmip_readiness.md
      - Real-hardware scaling: REAL_HARDWARE_SCALING.md

markdown_extensions:
  - admonition
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true

# Build with:  pip install mkdocs-material && mkdocs serve
# (mkdocs-material is an optional docs dependency — see the [docs] extra.)
