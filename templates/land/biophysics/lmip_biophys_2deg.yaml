# The ~2 deg CRU-JRA-forced BIOPHYSICS-ONLY LMIP: two-leaf canopy + MOST +
# multi-layer Richards soil, carbon OFF, prescribed seasonal CLM LAI, with the
# 2026-07 calibrated configuration (albedo / soil grid / roots) ON by default.
#
# ONE template for both spin-up and production: the default is a 10-year COLD
# START (this exact config, years 1975-1984, produced the published soil-state
# IC — docs/land/lmip_biophys_soil_ic_spinup.md); a warm-started block is the
# same template with `-o restart.from=...` + shifted years.  The reference
# 30-year run (spin-up -> 1985-2014) is four jobs:
#
#   # spin-up 1975-1984 (cold start; or skip it — download the published IC)
#   python scripts/run/init_experiment.py biophysics/lmip_biophys_2deg \
#       --name spinup --output-dir $ROOT/spinup --machine derecho_gpu
#   # production 1985-1994 / 1995-2004 / 2005-2014, each warm-started from the
#   # previous block's end-of-run restart:
#   python scripts/run/init_experiment.py biophysics/lmip_biophys_2deg \
#       --name prod_1985 --output-dir $ROOT/prod_1985 --machine derecho_gpu \
#       -o forcing.year_start=1985 -o forcing.year_end=1994 \
#       -o restart.from=$ROOT/spinup/restart_1985_d000h00.npz
#
# Each calibration selector reverts with one `-o` override (albedo_calibration /
# root_calibration -> default, soil_n_layers/soil_depth_m -> 8/0.0), so a
# controlled pre-calibration baseline is a documented command, not a checkout.
#
# ⚠️ Exact reproduction of the published 2026-07 run additionally needs the NCAR
# glade forcing variant: `-o forcing.prefix=clmforc.CRUJRAv2.5_filled_antarct_and_grnlnd_0.5x0.5`
# (the public mirror serves the unfilled variant, which differs over
# Antarctica/Greenland).
#
# ⚠️ CALIBRATION (#730): the interactive canopy conductance is UNCALIBRATED on
# the deep, moist Richards soil and can OVER-TRANSPIRE (amip_sota disabled the
# analogous SimpleSEB Jarvis path for this reason).  Interpret the first 10-yr
# climatology accordingly, and tune the exposed knobs (stomatal_model / vc_max25
# / g1 / gs_max) against ERA5/FLUXNET before treating fluxes as production.

template_name: biophysics/lmip_biophys_2deg
template_version: 2.0.0
description: 2 deg CRU-JRA biophysics LMIP (spin-up + production), hourly, two-leaf canopy + MOST, calibrated

grid:
  type: latlon
  resolution: 90                # 90 x 180 ~ 2 deg

physics:
  land_mode: multilayer
  surface_scheme: two_leaf_canopy   # mechanistic canopy (intrinsic stomata)
  bulk_scheme: most                 # stability-dependent surface exchange (land)
  # --- composable knobs (defaults shown; all optional) ---
  stomatal_model: ball_berry        # canopy leaf conductance: ball_berry | medlyn
  snow_albedo_feedback: true
  # Snow: the single-node bulk SWE budget (the production-consistent scheme, also
  # what AMIP + the EC-site harness run).  High-latitude soil carries a known cold
  # bias + snow tower under it — a documented realism limit, not a crash.  NOTE:
  # no glacier sink exists, so ice sheets accumulate snow without bound
  # (~3100 Gt/yr at 2 deg) — ice-sheet snow/albedo are not usable for science.
  snow_scheme: single
  # Soil-water freeze/thaw (apparent-heat-capacity zero-curtain).  ON for the
  # production run: without it, boreal/Arctic winter columns lose their energy
  # budget once the top soil layer crosses freezing and drift to NaN (~3-8% of
  # land cells over 10 yr).  Bit-identical to sensible-only heat when disabled.
  enable_freeze_thaw: true
  # Surface-albedo parameter set.  "amip_multilayer" adopts the 2026-07 ERA5
  # recalibration that `clm_multilayer_setup` injects for the coupled multilayer
  # land: brighter fresh/aged snow, the Niu-Yang half-cover scale (15.4 vs the
  # uncalibrated 50 kg/m2 — the uncalibrated value leaves a 20 kg/m2 seasonal
  # pack only ~38% covered where the calibrated one gives ~86%), faster snow-age
  # decay, stronger dry-soil brightening, and a brighter ice-sheet base.  The
  # LMIP path builds params from the RAW PFT/biome tables, so it never saw this.
  # Set to "default" to reproduce a pre-2026-07-27 baseline byte-for-byte.
  # NOTE: this calibration was tuned under SimpleSEB (amip_sota's land surface
  # scheme), not the two-leaf canopy; the albedo terms are scheme-independent
  # but the pairing has not been re-validated at LMIP scale.
  albedo_calibration: amip_multilayer
  # --- Vertical soil grid -----------------------------------------------------
  # AMIP parity: 10 layers / 3.0 m (what clm_multilayer_setup + amip_sota run),
  # replacing the 8-layer / 6.375 m loader default.  The surfdata soil profile is
  # remapped onto THIS grid, so the two cannot desync.
  #
  # ⚠️ dz_top: at growth_factor 2.0 a 10-layer / 3.0 m column has a **2.93 mm**
  # top layer, vs 25 mm for the 8-layer default (CLM5 itself uses ~17.5 mm).  The
  # top layer drives the Sellers/SZ09 bare-soil-evaporation resistance and IS the
  # `theta_soil_top` / `T_soil_top` tape variables — so those diagnostics change
  # MEANING relative to an 8-layer baseline and are not directly comparable.
  # Raise soil_growth_factor (~1.65 -> ~13 mm) for a CLM-like top layer at the
  # same depth and layer count.
  soil_n_layers: 10
  soil_depth_m: 3.0
  soil_growth_factor: 2.0
  # ⚠️ The surfdata vertical remap (`_remap_soil_layers`) is linear interpolation
  # in depth, NOT mass-conservative; it was validated against the 8-layer default.
  # Changing the target grid exercises it in a new regime — soil texture/carbon
  # column integrals are approximate here.
  # --- Root-zone water uptake -------------------------------------------------
  # "amip_multilayer" replaces ONE global root e-folding depth + plant
  # theta_wp/theta_fc (1.0 m / 0.15 / 0.30 for every column on Earth) with the
  # calibrated PER-PFT tables at the column's dominant PFT: root depth
  # 0.088-1.706 m, theta_wp 0.082-0.116, theta_fc 0.171-0.292.  The uniform 1 m
  # over-supplies shallow-rooted grass and under-supplies deep-rooted forest.
  #
  # ⚠️ THIS IS THE "TEST" HALF, NOT A KNOWN-GOOD DEFAULT.  Those tables were
  # calibrated under SimpleSEB + MOST (amip_sota's land surface scheme), which
  # has its own beta_soil moisture path; the two-leaf canopy carries its own
  # stomatal control, so the pairing is a hypothesis.  Run it against the
  # `default` baseline before adopting.  Note also: this path applies the
  # DOMINANT-PFT value (consistent with LAI/height/Vcmax/roughness here), whereas
  # the coupled CLMSurfaceParamProvider PFT-fraction-WEIGHTS the same tables.
  root_calibration: amip_multilayer
  # Stomatal/photosynthesis calibration (null = per-PFT surfdata / land default).
  # Set these to fight #730 over-transpiration once calibrated:
  vc_max25: null                    # max carboxylation @25C [umol/m2/s] (~19.8-180)
  g1: null                          # stomatal slope (ball_berry ~2.97-27, medlyn ~1.3-12)
  gs_max: null                      # max conductance [mol/m2/s] (~0.099-0.9)
  # SimpleSEB-only interactive Jarvis stomata (ignored by the canopy scheme):
  stomata_enabled: false

forcing:
  source: cru_jra
  data_dir: data/crujra
  prefix: clmforc.CRUJRAv2.5_0.5x0.5
  suffix: ""
  year_start: 1975
  year_end: 1984                  # 10 contiguous years (stage all with download_lmip_data.sh)
  k_neighbors: 4

surfdata:
  # c260716 (Zenodo record 21401647).  The superseded c250617 over-stated global
  # land area by ~26%, inflating every global TOTAL computed from a run made
  # with it; c260716's land area is within 1.4% of the CLM LANDFRAC reference.
  path: data/legoesm_surfdata_c260716.nc

time:
  dt: 3600.0                      # 1 h
  n_steps: 87600                  # 10 years hourly (10 * 8760)
  start_doy: 0.0

restart:
  from: ""                        # cold start; set to a restart_*.npz to chain

land_frac_min: 0.0                # any surfdata land (was 0.5; forcing now finite on all land)
land_mask_file: ""

output:
  tapes:
    - name: monthly
      freq: monthly
      average: mean
      vars: [T_sfc, Rnet, shflx, lhflx, albedo, LAI, GPP, ET, transp, soil_evap, runoff, precip, reverted]

    - name: monthly_state
      freq: monthly
      average: inst
      vars: [T_soil_top, theta_soil_top, snow_depth]

    - name: annual
      freq: annual
      average: mean
      vars: [T_sfc, shflx, lhflx, runoff, precip]
