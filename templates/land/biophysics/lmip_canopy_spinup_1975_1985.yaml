# SPIN-UP: 10-year CRU-JRA biophysics LMIP, 1975->1985, to equilibrate the soil
# state for the 1985-2015 validation run.  ~2 deg latlon, two-leaf canopy + MOST +
# multi-layer Richards soil, carbon OFF, prescribed seasonal CLM LAI.
#
# SNOW SCHEME: "single" (default single-node bulk SWE budget) — the stable,
# production-consistent scheme also used by AMIP and the EC-site harness.  NOT the
# multilayer snow column (that is unstable at global scale; see
# docs/land/phase2b_snow_thermal_plan.md + memory).  High-latitude soil carries a
# known cold bias + snow tower under this scheme — a documented realism limitation,
# not a crash.
#
# CHAINING: this is a COLD START (restart.from empty).  It runs 1975-1984 inclusive
# (10 noleap years) and writes restart_1985_d000h00.npz = the soil/snow state at the
# start of 1985.  Feed THAT file into the validation template via
#   init_experiment.py biophysics/lmip_canopy_validation_1985_2015 \
#       -o restart.from=<this_output_dir>/restart_1985_d000h00.npz
#
# ⚠️ CALIBRATION (#730): the interactive canopy conductance is UNCALIBRATED and can
# OVER-TRANSPIRE; interpret the biophysics climatology accordingly.

template_name: biophysics/lmip_canopy_spinup_1975_1985
template_version: 1.0.0
description: 10-year CRU-JRA biophysics LMIP spin-up 1975-1985, 2 deg, two-leaf canopy + MOST + single snow

grid:
  type: latlon
  resolution: 90                # 90 x 180 ~ 2 deg

physics:
  land_mode: multilayer
  surface_scheme: two_leaf_canopy   # mechanistic canopy (intrinsic stomata)
  bulk_scheme: most                 # stability-dependent surface exchange (land)
  stomatal_model: ball_berry        # canopy leaf conductance: ball_berry | medlyn
  snow_albedo_feedback: true
  snow_scheme: single               # stable production scheme (explicit; = the default)
  enable_freeze_thaw: true          # soil-water zero-curtain (stabilises freezing columns)
  vc_max25: null
  g1: null
  gs_max: null
  stomata_enabled: false

forcing:
  source: cru_jra
  data_dir: data/crujra
  prefix: clmforc.CRUJRAv2.5_filled_antarct_and_grnlnd_0.5x0.5
  suffix: ""
  year_start: 1975
  year_end: 1984                  # 10 contiguous years (1975-1984 inclusive)
  k_neighbors: 4

surfdata:
  path: data/legoesm_surfdata_c250617.nc

time:
  dt: 3600.0                      # 1 h
  n_steps: 87600                  # 10 years hourly (10 * 8760)
  start_doy: 0.0

restart:
  from: ""                        # COLD START (spin-up)

land_frac_min: 0.0
land_mask_file: ""

output:
  tapes:
    - name: monthly
      freq: monthly
      average: mean
      vars: [T_sfc, Rnet, shflx, lhflx, albedo, LAI, GPP, ET, transp, soil_evap, runoff, precip, reverted]

    - name: monthly_state
      freq: monthly
      average: inst
      vars: [T_soil_top, theta_soil_top, snow_depth]

    - name: annual
      freq: annual
      average: mean
      vars: [T_sfc, shflx, lhflx, runoff, precip]
