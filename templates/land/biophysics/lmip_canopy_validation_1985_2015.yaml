# VALIDATION: 30-year CRU-JRA biophysics LMIP, 1985->2015, warm-started from the
# 1975-1985 spin-up.  ~2 deg latlon, two-leaf canopy + MOST + multi-layer Richards
# soil, carbon OFF, prescribed seasonal CLM LAI.  This is the run to evaluate against
# observations (ERA5 / FLUXNET / GLEAM etc.).
#
# SNOW SCHEME: "single" — identical physics to the spin-up template
# (lmip_canopy_spinup_1975_1985.yaml).  For the restart to be compatible, EVERY
# physics/grid/surfdata field here MUST match the spin-up (same ncol, soil layers,
# surface scheme, snow scheme, freeze/thaw) — only the years + n_steps + restart.from
# differ.  Do not change physics between spin-up and validation, or the warm start is
# inconsistent.
#
# CHAINING (REQUIRED): supply the spin-up's final restart at init time --
#   init_experiment.py biophysics/lmip_canopy_validation_1985_2015 \
#       --name lmip_val_1985 --output-dir $SCRATCH/lmip/val_1985 --machine derecho_gpu \
#       -o restart.from=$SCRATCH/lmip/spinup_1975/restart_1985_d000h00.npz
# Runs 1985-2014 inclusive (30 noleap years) and writes restart_2015_d000h00.npz.
#
# ⚠️ CALIBRATION (#730): the interactive canopy conductance is UNCALIBRATED and can
# OVER-TRANSPIRE; interpret the biophysics climatology accordingly.  High-latitude
# soil carries a known single-scheme cold bias + snow tower (documented limitation).

template_name: biophysics/lmip_canopy_validation_1985_2015
template_version: 1.0.0
description: 30-year CRU-JRA biophysics LMIP validation 1985-2015, 2 deg, two-leaf canopy + MOST + single snow (warm start)

grid:
  type: latlon
  resolution: 90                # 90 x 180 ~ 2 deg (MUST match the spin-up)

physics:
  land_mode: multilayer
  surface_scheme: two_leaf_canopy
  bulk_scheme: most
  stomatal_model: ball_berry
  snow_albedo_feedback: true
  snow_scheme: single           # MUST match the spin-up restart's scheme
  enable_freeze_thaw: true
  vc_max25: null
  g1: null
  gs_max: null
  stomata_enabled: false

forcing:
  source: cru_jra
  data_dir: data/crujra
  prefix: clmforc.CRUJRAv2.5_filled_antarct_and_grnlnd_0.5x0.5
  suffix: ""
  year_start: 1985
  year_end: 2014                  # 30 contiguous years (1985-2014 inclusive)
  k_neighbors: 4

surfdata:
  path: data/legoesm_surfdata_c250617.nc

time:
  dt: 3600.0                      # 1 h
  n_steps: 262800                 # 30 years hourly (30 * 8760)
  start_doy: 0.0

restart:
  from: ""                        # SET AT INIT: -o restart.from=<spinup>/restart_1985_d000h00.npz

land_frac_min: 0.0
land_mask_file: ""

output:
  tapes:
    - name: monthly
      freq: monthly
      average: mean
      vars: [T_sfc, Rnet, shflx, lhflx, albedo, LAI, GPP, ET, transp, soil_evap, runoff, precip, reverted]

    - name: monthly_state
      freq: monthly
      average: inst
      vars: [T_soil_top, theta_soil_top, snow_depth]

    - name: annual
      freq: annual
      average: mean
      vars: [T_sfc, shflx, lhflx, runoff, precip]
