# 5-year multi-year CRU-JRA forced biophysics spin-up at ~2° latlon.
#
# The canonical example: use this as a starting point for a real spin-up
# and override anything with `init_experiment.py -o key.path=value`.

template_name: biophysics/spinup_5year
template_version: 1.0.0
description: 5-year CRU-JRA biophysics spin-up, 2 deg latlon, hourly, two-leaf canopy + MOST

grid:
  type: latlon
  resolution: 90                # 90 x 180 ~ 2 deg

physics:
  land_mode: multilayer
  surface_scheme: two_leaf_canopy
  bulk_scheme: most

forcing:
  source: cru_jra
  data_dir: data/crujra
  prefix: clmforc.CRUJRAv2.5_filled_antarct_and_grnlnd_0.5x0.5
  suffix: ""
  year_start: 1920
  year_end: 1924
  k_neighbors: 4

surfdata:
  path: data/legoesm_surfdata_c250617.nc

time:
  dt: 3600.0                    # 1 h
  n_steps: 43800                # 5 years hourly
  start_doy: 0.0

restart:
  from: ""                      # cold start; set to a restart_*.npz to chain

land_frac_min: 0.5
land_mask_file: ""

output:
  tapes:
    - name: monthly
      freq: monthly
      average: mean
      vars: [T_sfc, shflx, lhflx, albedo, LAI, runoff, precip]

    - name: monthly_state
      freq: monthly
      average: inst
      vars: [T_soil_top, theta_soil_top, snow_depth]
