# ~4° global BIOPHYSICS-ONLY LMIP smoke — the "does the global run stand up?"
# test on the SAME physics as the 2° production 10yr (two_leaf_canopy + MOST +
# multilayer Richards soil), but cheap enough to iterate on Derecho in minutes.
#
# Purpose: a first global shakedown of the merged land code (soil freeze/thaw +
# the per-cell canopy soil/vegetation albedo fix) BEFORE committing to a full
# spin-up.  Deliberately starts at day-of-year 0 (January = deep NH winter) so
# the boreal/Arctic columns sit below freezing from step 1 — the exact regime
# the freeze/thaw zero-curtain was wired to stabilise (without it ~3-8% of land
# cells NaN'd over 10 yr).  A clean finish here (no NaN gate trip, sane albedo
# north of ~50°N) is the green light to scale to 2° and multi-year.
#
# Scale vs lmip_canopy_10yr: 45x90 (≈4°) = 4x fewer cells than 90x180, and 30
# model days vs 10 yr.  Override anything with `init_experiment.py -o k.p=v`
# (e.g. -o time.n_steps=2160 for 90 days, -o grid.resolution=90 for 2°).

template_name: biophysics/lmip_canopy_4deg_smoke
template_version: 1.0.0
description: 4 deg global biophysics LMIP smoke, two-leaf canopy + MOST, freeze/thaw ON, 30-day Jan

grid:
  type: latlon
  resolution: 45                # 45 x 90 ~ 4 deg

physics:
  land_mode: multilayer
  surface_scheme: two_leaf_canopy   # exercises the per-cell canopy albedo fix
  bulk_scheme: most
  stomatal_model: ball_berry
  snow_albedo_feedback: true
  # Soil-water freeze/thaw (apparent-heat-capacity zero-curtain).  ON: the whole
  # point of this smoke is to confirm boreal/Arctic winter columns keep their
  # energy budget instead of drifting to NaN.  Bit-identical to sensible-only
  # heat when disabled — flip to false to reproduce the pre-fix NaN signature.
  enable_freeze_thaw: true
  # Stomatal/photosynthesis calibration (null = per-PFT surfdata / land default).
  vc_max25: null
  g1: null
  gs_max: null
  stomata_enabled: false            # SimpleSEB-only Jarvis path; canopy ignores it

forcing:
  source: cru_jra
  data_dir: data/crujra
  prefix: clmforc.CRUJRAv2.5_0.5x0.5
  suffix: ""
  year_start: 1920
  year_end: 1920                  # single year
  k_neighbors: 4

surfdata:
  path: data/legoesm_surfdata_c250617.nc

time:
  dt: 3600.0                      # 1 h
  n_steps: 720                    # 30 days hourly (deep NH winter from doy 0)
  start_doy: 0.0

restart:
  from: ""                        # cold start

land_frac_min: 0.0                # any surfdata land (was 0.5; forcing now finite on all land)
land_mask_file: ""

output:
  tapes:
    - name: monthly
      freq: monthly
      average: mean
      vars: [T_sfc, Rnet, shflx, lhflx, albedo, LAI, GPP, ET, transp, soil_evap, runoff, precip, reverted]

    - name: monthly_state
      freq: monthly
      average: inst
      vars: [T_soil_top, theta_soil_top, snow_depth]
