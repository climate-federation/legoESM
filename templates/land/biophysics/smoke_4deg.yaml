# ~4 deg global BIOPHYSICS-ONLY LMIP smoke — the "does the global run stand up?"
# test on the SAME physics as biophysics/lmip_biophys_2deg (two-leaf canopy +
# MOST + multilayer Richards soil + the calibration selectors), but 4x fewer
# cells and 30 model days instead of 10 years: minutes on a GPU, tens of
# minutes on CPU.
#
# Deliberately starts at day-of-year 0 (January = deep NH winter) so the
# boreal/Arctic columns sit below freezing from step 1 — the regime the
# freeze/thaw zero-curtain stabilises (without it ~3-8% of land cells NaN over
# 10 yr).  A clean finish (no NaN gate trip, sane albedo north of ~50N) is the
# green light for the 2 deg template.
#
# Need a REALLY cheap pipeline-iteration smoke instead?  Override to the skin
# SEB path (~10x cheaper per step):
#   -o physics.surface_scheme=simple_seb -o physics.bulk_scheme=constant

template_name: biophysics/smoke_4deg
template_version: 2.0.0
description: 4 deg biophysics LMIP smoke, two-leaf canopy + MOST, calibrated, 30-day Jan

grid:
  type: latlon
  resolution: 45                # 45 x 90 ~ 4 deg

physics:
  land_mode: multilayer
  surface_scheme: two_leaf_canopy   # exercises the per-cell canopy albedo path
  bulk_scheme: most
  stomatal_model: ball_berry
  snow_albedo_feedback: true
  snow_scheme: single
  # ON: the point of this smoke is that boreal/Arctic winter columns keep their
  # energy budget instead of drifting to NaN.
  enable_freeze_thaw: true
  # Calibrated parameter values, byte-identical to lmip_biophys_2deg so this
  # smoke exercises exactly the production configuration (see that template for
  # the full rationale, units, and how to revert each block); a test asserts
  # the two templates' physics are EQUAL, so edit both or neither.
  albedo:
    alpha_snow_max: 0.8077
    alpha_snow_min: 0.5207
    snow_depth_crit: 15.4229
    tau_snow_decay: 317424.96
    soil_dry_albedo_boost: 0.1458
  glacier_albedo_vis: 0.8178
  glacier_albedo_nir: 0.6178
  soil_n_layers: 10
  soil_depth_m: 3.0
  soil_growth_factor: 2.0
  root_depth_per_pft: [0.088, 1.706, 1.469, 1.414, 1.631, 1.675, 1.527, 1.408,
                       1.088, 0.716, 0.622, 0.723, 0.457, 0.507, 0.504, 0.488,
                       0.477]
  theta_wp_per_pft:   [0.0846, 0.0915, 0.0942, 0.0907, 0.1154, 0.0988, 0.1162,
                       0.1062, 0.1035, 0.0988, 0.0838, 0.0839, 0.0865, 0.0874,
                       0.0869, 0.0822, 0.0988]
  theta_fc_per_pft:   [0.1706, 0.2249, 0.2351, 0.2253, 0.289, 0.2492, 0.2918,
                       0.2676, 0.2599, 0.2635, 0.1995, 0.2045, 0.2164, 0.2171,
                       0.2193, 0.2123, 0.2469]
  # Stomatal/photosynthesis calibration (null = per-PFT surfdata / land default).
  vc_max25: null
  g1: null
  gs_max: null
  stomata_enabled: false            # SimpleSEB-only Jarvis path; canopy ignores it

forcing:
  source: cru_jra
  data_dir: data/crujra
  prefix: clmforc.CRUJRAv2.5_0.5x0.5
  suffix: ""
  year_start: 1920
  year_end: 1920                  # single year
  k_neighbors: 4

surfdata:
  path: data/legoesm_surfdata_c260716.nc

time:
  dt: 3600.0                      # 1 h
  n_steps: 720                    # 30 days hourly (deep NH winter from doy 0)
  start_doy: 0.0

restart:
  from: ""                        # cold start

land_frac_min: 0.0                # any surfdata land (was 0.5; forcing now finite on all land)
land_mask_file: ""

output:
  tapes:
    - name: monthly
      freq: monthly
      average: mean
      vars: [T_sfc, Rnet, shflx, lhflx, albedo, LAI, GPP, ET, transp, soil_evap, runoff, precip, reverted]

    - name: monthly_state
      freq: monthly
      average: inst
      vars: [T_soil_top, theta_soil_top, snow_depth]
