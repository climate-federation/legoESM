# ~4 deg global biophysics LMIP with TRANSIENT LAND-USE / LAND-COVER CHANGE.
#
# Same physics as lmip_canopy_10yr (two-leaf canopy + MOST + multilayer Richards +
# freeze/thaw) but with transient anthropogenic cover: the per-column PFT fractions
# evolve year-by-year from a reconstruction, re-weighting LAI, canopy params, and
# albedo each step, and E_LUC land-use-change carbon is booked as a post-run
# diagnostic.  This is the "LULCC as an option" config — flip surfdata.land_cover_dataset
# back to clm5 (and drop the land_use_change block) for a static-cover run.
#
# ⚠️ PREREQUISITE — a TRANSIENT surfdata.  The transient-cover engine keys off the
# surfdata's number of cover years; the default single-year surfdata will FAIL FAST
# here (declared reconstruction + static surfdata = silent no-op, which the driver
# refuses).  Bake a transient surfdata first, e.g. HYDE anthropogenic cover:
#
#   python scripts/data/build_anthropogenic_surfdata.py --dataset hyde \
#     --base data/legoesm_surfdata_c250617.nc \
#     --year-start 1920 --year-end 1929 \
#     --out data/legoesm_surfdata_hyde_1920-1929.nc
#
# LUH2/LUH3 (native GROSS transitions -> best E_LUC fidelity) go through
# build_luh2_transient_surfdata instead; set land_cover_dataset: luh2 to match.
#
# The cover years must span the forcing years (below).  Override anything with
# `init_experiment.py -o k.p=v`.

template_name: biophysics/lmip_canopy_lulcc
template_version: 1.0.0
description: 4 deg global biophysics LMIP with transient LULCC (HYDE cover + E_LUC), two-leaf canopy

grid:
  type: latlon
  resolution: 45                # 45 x 90 ~ 4 deg

physics:
  land_mode: multilayer
  surface_scheme: two_leaf_canopy
  bulk_scheme: most
  stomatal_model: ball_berry
  snow_albedo_feedback: true
  enable_freeze_thaw: true
  vc_max25: null
  g1: null
  gs_max: null
  stomata_enabled: false

forcing:
  source: cru_jra
  data_dir: data/crujra
  prefix: clmforc.CRUJRAv2.5_0.5x0.5
  suffix: ""
  year_start: 1920
  year_end: 1929                  # decade of transient cover (must overlap the surfdata cover years)
  k_neighbors: 4

surfdata:
  # MUST be a transient (multi-year pft_frac) surfdata — see the build note above.
  path: data/legoesm_surfdata_hyde_1920-1929.nc
  land_cover_dataset: hyde        # clm5 (static) | luh2 | luh3 | hyde | pongratz | kk10

# E_LUC land-use-change carbon bookkeeping (BLUE/Houghton).  Post-run annual
# diagnostic over the transient cover series; writes <output>.eluc_annual.txt.
# Remove this block (or scheme: none) to skip it.
land_use_change:
  scheme: bookkeeping

time:
  dt: 3600.0                      # 1 h
  n_steps: 87600                  # 10 years hourly (scale down for a smoke)
  start_doy: 0.0

restart:
  from: ""

land_frac_min: 0.0                # any surfdata land (was 0.5; forcing now finite on all land)
land_mask_file: ""

output:
  tapes:
    - name: monthly
      freq: monthly
      average: mean
      vars: [T_sfc, Rnet, shflx, lhflx, albedo, LAI, GPP, ET, transp, soil_evap, runoff, precip, reverted]

    - name: monthly_state
      freq: monthly
      average: inst
      vars: [T_soil_top, theta_soil_top, snow_depth]

    - name: annual
      freq: annual
      average: mean
      vars: [T_sfc, shflx, lhflx, runoff, precip]
